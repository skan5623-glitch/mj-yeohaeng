<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>여행 플래너</title>
<meta name="description" content="함께 짜는 여행 일정">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fff'/%3E%3Cpath d='M32 10a15 15 0 0 0-15 15c0 11 15 27 15 27s15-16 15-27a15 15 0 0 0-15-15z' fill='%2316181d'/%3E%3Ccircle cx='32' cy='25' r='5.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --bg:#fff; --text:#16181d; --sub:#8b9098; --faint:#b9bdc4; --line:#eeeff1; --hover:#f6f6f7; --accent:#16181d; --warn:#9a6b12;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{overscroll-behavior:none;margin:0;height:100%;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:var(--text);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:none;background:transparent;border-radius:6px;padding:5px 8px;color:var(--sub)}
button:hover:not(:disabled){background:var(--hover);color:var(--text)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);color:#fff;padding:7px 14px;font-weight:600}
button.primary:hover:not(:disabled){background:#000;color:#fff}
button.line{border:1px solid var(--line);color:var(--text)}
button.danger{color:#c92a2a}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--text)}
select.bare{border:none;padding:2px 0;background:transparent;color:var(--sub);cursor:pointer}
select.bare:hover{color:var(--text)}
input[type=checkbox]{accent-color:var(--text);margin:0}
a{color:var(--text);text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
a:hover{text-decoration-color:var(--text)}
small{font-size:.86em}

#app{display:flex;height:100%}
#side{width:400px;flex:none;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line);min-height:0}
#map{flex:1;min-width:0;background:#f4f4f2}
#split{display:none}
@media (max-width:820px){
  #app{flex-direction:column-reverse}
  #side{width:100%;flex:1;height:auto;border-right:none;border-top:1px solid var(--line)}
  #map{height:var(--mapH,42%);flex:none}
  /* 지도와 일정 사이 손잡이: 끌어서 크기 조절, 누르면 작게·보통·크게 */
  #split{display:flex;justify-content:center;align-items:center;height:32px;margin:-6px 0 -14px;position:relative;z-index:5;flex:none;cursor:row-resize;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #split i{width:40px;height:4px;border-radius:2px;background:var(--faint)}
  #split:active i,#split.on i{background:var(--text)}
}

.top{padding:18px 20px 4px}
.top .row1{display:flex;gap:2px;align-items:center}
.top select{flex:1;font-weight:700;font-size:18px;border:none;padding:0;background:transparent;cursor:pointer;letter-spacing:-.02em;min-width:0}
.tripmeta{color:var(--sub);font-size:12.5px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:5px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--c,#2f9e44)}
.people{display:flex;gap:2px;flex-wrap:wrap;padding:10px 20px 0}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px}
.pchip.on{background:var(--text);color:#fff}
.pchip.on:hover{background:var(--text);color:#fff}
.pchip small{opacity:.6}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c)}
.pchip.live .pdot{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--c)}
.pchip.on.live .pdot{box-shadow:0 0 0 2px var(--text),0 0 0 3.5px var(--c)}
.search{display:flex;gap:6px;align-items:center;padding:14px 20px 0}
.search input{flex:1;background:var(--hover);border-color:transparent;padding:9px 12px;border-radius:8px}
.search input:focus{background:#fff;border-color:var(--text)}
.search select{flex:none;max-width:104px;font-size:12.5px}
.search button{flex:none;font-size:12.5px}
#results{margin:8px 20px 0;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px}
#results:empty{display:none}
.res{display:flex;gap:8px;align-items:center;padding:9px 12px;cursor:pointer}
.res + .res{border-top:1px solid var(--line)}
.res:hover{background:var(--hover)}
.res .t{flex:1;min-width:0}
.res .n{font-weight:600}
.res .a{color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res button{flex:none;font-size:12.5px}
.src{font-size:11.5px;color:var(--sub);padding:7px 12px;display:flex;justify-content:space-between}
.src a{color:var(--sub)}

#tabs{display:flex;gap:16px;padding:16px 20px 0;overflow-x:auto;border-bottom:1px solid var(--line);flex:none;scrollbar-width:none}
.tab{white-space:nowrap;border-radius:0;padding:0 0 10px;color:var(--faint);border-bottom:2px solid transparent;font-weight:600;margin-bottom:-1px}
.tab:hover:not(:disabled){background:transparent;color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--text)}
.tab .cnt{font-size:11px;margin-left:3px;font-weight:500}
.tab.drop{color:var(--text);border-bottom-color:var(--faint)}

#panel{flex:1;overflow:auto;padding:16px 20px 48px;min-height:0;overscroll-behavior:contain}
.sec{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin:0 -8px 4px 0}
.sec > span{font-weight:600}
.dayhead{display:flex;gap:10px;align-items:baseline;margin-bottom:4px;flex-wrap:wrap}
.dayhead .ttl{font-weight:700;font-size:16px;margin-right:auto}
.dayhead .ttl small{color:var(--sub);font-weight:500;margin-left:6px;font-size:13px}
.dayhead input[type=time]{border:none;padding:0;color:var(--sub);background:transparent;width:auto}
.dayhead label{color:var(--sub);font-size:12.5px;display:flex;gap:4px;align-items:baseline}
.dayhead select.bare{max-width:120px}
.dayopts{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin:0 -8px 12px;font-size:12.5px;color:var(--sub)}
.dayopts > span{padding:0 8px}
.dayopts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.dayopts .sp{flex:1}
.summary{font-size:12.5px;color:var(--sub);padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:14px}
.summary b{color:var(--text);font-weight:600}
.msum{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--sub);padding:3px 0;cursor:pointer}
.msum:hover{color:var(--text)}
.msum b{color:var(--text);font-weight:600}
.warn{color:var(--warn);font-size:12.5px;line-height:1.6;margin:-4px 0 14px}
.banner{background:var(--hover);border-radius:8px;padding:12px 14px;font-size:12.5px;margin-bottom:16px;line-height:1.7}
.banner button{margin-top:6px}

.areas{margin:0 0 20px}
.arow{display:flex;align-items:center;gap:8px;padding:5px 8px;margin:0 -8px;border-radius:6px;cursor:pointer;font-size:13.5px}
.arow:hover{background:var(--hover)}
.arow.on{background:var(--hover);font-weight:600}
.arow .al{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow.d0 .al{font-weight:600}
.arow .c{margin-left:auto;color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
.arow .ed{opacity:0;font-size:12px;padding:0 4px}
.arow:hover .ed{opacity:1}
@media (hover:none){ .arow .ed{opacity:1} }
.ghead{font-size:12px;color:var(--sub);margin:16px 0 4px;font-weight:600}
.ghead:first-child{margin-top:0}

ul.list{list-style:none;margin:0;padding:0}
.item{border-radius:8px}
.item.dragging{opacity:.3}
.item.over-top{box-shadow:0 -2px 0 var(--text)}
.item.over-bot{box-shadow:0 2px 0 var(--text)}
.row{display:flex;gap:12px;align-items:center;padding:8px;margin:0 -8px;cursor:pointer;border-radius:8px}
.row:hover{background:var(--hover)}
.num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--c,var(--faint));color:#fff;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center}
.num.hollow{background:#fff;border:1.5px solid var(--faint)}
.info{flex:1;min-width:0}
.info .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .sub{color:var(--sub);font-size:12px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .time{color:var(--text);font-variant-numeric:tabular-nums}
.closed{color:var(--warn)}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:1px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c);display:inline-block}
.rt{color:var(--sub);font-weight:500;font-size:12px}
.grip{color:var(--faint);cursor:grab;user-select:none;opacity:0;font-size:13px;letter-spacing:-2px;padding:6px 2px;touch-action:none;-webkit-user-select:none}
.row:hover .grip{opacity:1}
.xdel{flex:none;width:26px;height:26px;padding:0;border-radius:50%;color:var(--faint);font-size:18px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.xdel:hover:not(:disabled){color:#c92a2a;background:#fff}
@media (hover:none){ .grip{opacity:1;padding:8px 6px} }
body.is-dragging, body.is-dragging *{cursor:grabbing!important;user-select:none}
#ghost{position:fixed;left:0;top:0;z-index:4000;pointer-events:none;background:var(--text);color:#fff;border-radius:6px;padding:4px 10px;font-size:12.5px;white-space:nowrap;display:none}
.edit{padding:6px 0 14px 34px;display:grid;grid-template-columns:72px 1fr;gap:8px 10px;align-items:center;font-size:13px}
.edit label{color:var(--sub);font-size:12.5px}
.edit textarea{min-height:56px;resize:vertical}
.edit .btns{grid-column:1/-1;display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-left:-8px}
.edit .btns .sp{flex:1}
.edit .addr{grid-column:1/-1;font-size:12px;color:var(--sub)}
.edit .hours{font-size:12px;color:var(--sub);white-space:pre-line;line-height:1.55}
.wchips{display:flex;gap:4px;flex-wrap:wrap}
.wchips button{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--sub)}
.wchips button.on{background:var(--c);border-color:var(--c);color:#fff}

.leg{list-style:none;margin:0 0 0 2px;padding:6px 0 6px 20px;border-left:1px solid var(--line);font-size:12px;color:var(--sub)}
.leg .chip{cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.leg .chip:hover{color:var(--text)}
.leg .est{font-size:11px;color:var(--warn)}
.leg .detail{margin:8px 0 4px;color:var(--text)}
.step{display:flex;gap:10px;padding:5px 0;align-items:flex-start;font-size:12.5px}
.badge{flex:none;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700;color:#fff;background:var(--text);min-width:34px;text-align:center}
.badge.walk{background:transparent;color:var(--sub);border:1px solid var(--line)}
.step .st{flex:1;min-width:0;line-height:1.5}
.step .st small{color:var(--sub)}
.hint{font-size:12px;color:var(--sub);line-height:1.6}
.viaedit{margin:0 0 8px}
.vchips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.vchips button{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--sub)}
.vchips button.on{background:var(--text);border-color:var(--text);color:#fff}
.vrow{display:flex;gap:6px}
.vrow input{font-size:12px;padding:5px 7px}
.vrow input[data-via-note]{flex:1}
.vrow input[data-via-min]{width:110px}

.empty{color:var(--sub);padding:28px 0;line-height:1.8;font-size:13px}
.dayblock{padding:14px 0;border-bottom:1px solid var(--line)}
.dayblock .h{display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:700}
.dayblock .h .dt{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:8px;vertical-align:1px}
.dayblock .h small{color:var(--sub);font-weight:500;margin-left:6px}
.dayblock .h .go{color:var(--faint);font-weight:400}
.dayblock .h:hover .go{color:var(--text)}
.dayblock .h .acts{display:flex;align-items:center;gap:10px}
.addp{width:26px;height:26px;padding:0;border:1px solid var(--line);border-radius:50%;color:var(--text);font-size:17px;font-weight:400;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.addp:hover:not(:disabled){background:var(--text);color:#fff;border-color:var(--text)}
.addrow{display:block;width:100%;text-align:left;margin-top:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;color:var(--sub)}
.addrow:hover:not(:disabled){border-color:var(--text);background:transparent}
.adsec{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--sub);margin:18px 0 0}
.adsec b{color:var(--text);font-size:13px}
.bkrow .radd{flex:none;font-size:12.5px;padding:4px 10px;border:1px solid var(--line);color:var(--text)}
.bkrow .radd.done{border-color:transparent;color:var(--sub)}
a.gbtn{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:5px 10px;color:var(--text);text-decoration:none;font-size:12.5px}
a.gbtn:hover{border-color:var(--text)}
.leg .glink{float:right;font-size:11.5px;color:var(--sub);text-decoration:underline;margin-top:3px}
.dayblock ol{margin:8px 0 0;padding-left:16px;list-style:none}
.dayblock li{padding:2px 0;font-size:13.5px}
.dayblock li small{color:var(--sub);display:inline-block;width:44px;font-variant-numeric:tabular-nums}
.dayblock .s{font-size:12px;color:var(--sub);margin:6px 0 0 16px}
.dayblock .s.late{color:#c92a2a}
.dayblock li.fl{color:var(--sub)}
.flsum{font-size:13px;margin:2px 0 20px;display:flex;flex-direction:column;gap:4px}
.flsum b{font-weight:600}
.flsum .mut{color:var(--sub)}
.flrow{display:flex;gap:12px;align-items:center;padding:8px;margin:0 -8px;border-radius:8px}
.flrow > button{flex:none;font-size:12.5px}
.num.fl{background:var(--text);border-radius:6px}
.num.fl svg{width:13px;height:13px;color:#fff}
.apin{width:24px;height:24px;border-radius:6px;background:var(--text);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
.apin svg{width:15px;height:15px}
.locwrap{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.locwrap .leaflet-bar a{display:flex;align-items:center;justify-content:center;color:var(--text)}
.locwrap .leaflet-bar a svg{width:17px;height:17px}
.locbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:min(260px,70vw);box-shadow:0 4px 18px rgba(0,0,0,.08);font-size:12.5px}
.locbox .chk{display:flex;gap:7px;align-items:center;margin:2px 0 6px;cursor:pointer}
.locbox .chk small{color:var(--sub)}
.locbox .chk.off{color:var(--sub)}
.locbox .hint{font-size:11.5px;line-height:1.5}
.locppl{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.locppl button{border:1px solid var(--line);padding:3px 8px;color:var(--text);font-size:12px;display:inline-flex;gap:5px;align-items:center}
.locppl small{color:var(--sub)}
.locdot{position:relative;width:16px;height:16px}
.locdot i{position:absolute;inset:0;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 0 0 6px color-mix(in srgb,var(--c) 22%,transparent)}
.locdot span{position:absolute;left:20px;top:-1px;white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:600;color:var(--text)}
.locdot.stale{opacity:.5}
.locon{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px #fff,0 0 0 3px var(--c);margin-left:4px;vertical-align:1px}
.flcap{display:flex;flex-direction:column;gap:6px;margin:-6px 0 14px}
.flcap button{align-self:flex-start}
.capsum{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 16px;font-size:13px;display:flex;flex-direction:column;gap:5px}
.capsum .mut{color:var(--sub)}
.ocr{margin:6px 0 14px;font-size:12px;color:var(--sub)}
.ocr pre{white-space:pre-wrap;max-height:180px;overflow:auto;background:var(--hover);padding:8px;border-radius:6px}

.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.pin span{transform:rotate(45deg);color:#fff;font-weight:700;font-size:11px}
.pinlbl{position:absolute;left:29px;top:3px;white-space:nowrap;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11.5px;font-weight:600;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12);pointer-events:none;line-height:1.45}
.pinlbl.off{display:none}
.lblctl a{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--sub);text-decoration:none}
.lblctl a.on{color:var(--text)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.3);opacity:.75}
.leaflet-container{font-family:Pretendard,sans-serif}
.leaflet-popup-content-wrapper{border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.12)}
.leaflet-popup-content{font-size:13px;margin:14px 16px;line-height:1.5}
.pp b{font-size:14px}
.pp .addr{color:var(--sub);font-size:12px;margin:2px 0 10px}
.pp .pprow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.leaflet-bar a{border-radius:0!important;color:var(--text)}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:none!important}

#modal{position:fixed;inset:0;background:rgba(255,255,255,.7);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:2000;padding:16px}
#modal.on{display:flex}
.mbox{background:#fff;border:1px solid var(--line);border-radius:14px;width:min(480px,100%);max-height:90vh;overflow:auto;padding:26px 26px 22px;box-shadow:0 12px 48px rgba(0,0,0,.1)}
.mbox h2{margin:0 0 4px;font-size:18px;letter-spacing:-.02em}
.mbox h3{margin:0 0 10px;font-size:14px}
.mbox .desc{color:var(--sub);font-size:13px;margin:0 0 20px;line-height:1.6}
.mbox .f{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.mbox .f > span{font-size:12px;color:var(--sub)}
.mbox .hl{display:flex;gap:6px}
.mbox .hl input{flex:1}
.mbox .choices{border:1px solid var(--line);border-radius:6px;max-height:210px;overflow:auto;margin-top:4px}
.mbox .choices:empty{display:none}
.mbox .choice{padding:8px 10px;cursor:pointer}
.mbox .choice + .choice{border-top:1px solid var(--line)}
.mbox .choice:hover{background:var(--hover)}
.mbox .choice small{display:block;color:var(--sub);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbox .choice.on{background:var(--text);color:#fff}
.mbox .choice.on small{color:#c9ccd1}
.mbox .foot{display:flex;gap:6px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap;align-items:center}
.mbox .foot .sp{flex:1}
.mbox hr{border:none;border-top:1px solid var(--line);margin:18px 0}
.mbox .chk{display:flex;gap:8px;align-items:center;font-size:13px;margin:4px 0 8px;cursor:pointer}
.mbox .chk small{color:var(--sub)}
.picked{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.picked:empty{display:none}
.picked span{display:inline-flex;gap:4px;align-items:center;background:var(--hover);border-radius:999px;padding:3px 4px 3px 10px;font-size:12.5px}
.picked button{padding:0 6px}
.levels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.sw{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.sw button{width:22px;height:22px;border-radius:50%;background:var(--c);padding:0;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw button:hover:not(:disabled){background:var(--c)}
.sw button.on{box-shadow:0 0 0 2px var(--text)}
.sw input[type=color]{width:26px;height:26px;padding:0;border:none;background:none;cursor:pointer}
.mrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.mrow input[type=text]{flex:1}
.mrow input[type=color]{width:28px;height:28px;padding:0;border:none;background:none;cursor:pointer;flex:none}
.whopick{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.whopick button{display:flex;gap:10px;align-items:center;text-align:left;padding:9px 10px;color:var(--text);border:1px solid var(--line)}
.bklist{margin-top:12px;border:1px solid var(--line);border-radius:6px;max-height:260px;overflow:auto}
.bklist:empty{display:none}
.bkrow{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;font-size:13px}
.bkrow + .bkrow{border-top:1px solid var(--line)}
.bkrow .t{flex:1;min-width:0}
.bkrow small{display:block;color:var(--sub);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bkrow.fail{color:var(--sub)}
.bkrow .bkwhy{font-weight:600;color:var(--text)}
.bkbar{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12px;color:var(--sub)}
.bkbar button{padding:3px 8px;font-size:12px}
.bkbar .sp{flex:1}
.bkbar:empty{display:none}
.linkbox{display:flex;gap:6px}
.linkbox input{flex:1;font-size:12.5px;background:var(--hover)}

/* 처음 쓰는 사람 안내 */
#tour{position:fixed;inset:0;z-index:2500;display:none}
#tour.on{display:block}
.tour-dim{position:fixed;inset:0;width:100%;height:100%}
.tour-dim path{fill:rgba(22,24,29,.58)}
.tour-hole{position:fixed;border-radius:10px;box-shadow:0 0 0 2px rgba(255,255,255,.9);pointer-events:none}
.tour-card{position:fixed;background:#fff;border-radius:14px;padding:20px 20px 14px;width:min(330px,calc(100vw - 32px));box-shadow:0 12px 40px rgba(0,0,0,.18);transition:left .25s,top .25s}
.tour-card .ic{width:36px;height:36px;margin-bottom:12px;color:var(--text)}
.tour-card .ic svg{width:100%;height:100%}
.tour-card h4{margin:0 0 6px;font-size:16px;letter-spacing:-.02em}
.tour-card p{margin:0;color:var(--sub);font-size:13px;line-height:1.7}
.tour-card p b{color:var(--text);font-weight:600}
.tour-card .tf{display:flex;align-items:center;gap:4px;margin-top:16px}
.tour-card .dots{display:flex;gap:5px;margin-right:auto}
.tour-card .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.tour-card .dots i.on{background:var(--text)}
.upd{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:2600;background:var(--text);color:#fff;border-radius:10px;padding:8px 8px 8px 14px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.upd button{background:#fff;color:var(--text);font-weight:600;padding:5px 10px}
.upd button:hover:not(:disabled){background:#f1f1f1}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:3000;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
#toast.act{pointer-events:auto}
#toast button{color:#fff;font-weight:600;text-decoration:underline;padding:0 0 0 14px;border-radius:0}
#toast button:hover:not(:disabled){background:none;color:#fff}
.welcome{padding:32px 0;color:var(--sub);line-height:1.8;font-size:13px}
.welcome h3{color:var(--text);margin:0 0 8px;font-size:17px}
</style>

      const holds = b => a.lat >= b[0] && a.lat <= b[1] && a.lng >= b[2] && a.lng <= b[3];   // bbox = [남, 북, 서, 동]
      const r = rs.filter(x => (x.kind === 'boundary' || x.kind === 'place') && okBBox(x.bbox) && holds(x.bbox) && hav(a, x) < 5000)
        .sort((x, y) => hav(a, x) - hav(a, y))[0];
      const cur = S.cur === tid && trip()?.areas?.[aid];
      if(!r || !cur) continue;
      const ops = [];
      if(!okBBox(cur.bbox)) ops.push(opSet(['areas', aid, 'bbox'], r.bbox));
      if(!cur.cc && r.cc) ops.push(opSet(['areas', aid, 'cc'], r.cc));
      if(ops.length) commit(ops);
    }catch(e){}
  }
}
function pathFromAddress(name, a){
  a = a || {};
  const L1 = a.province || a.state || a.region || '';
  const L2 = a.city || a.town || a.county || a.municipality || a.village || '';
  const out = [];
  for(const x of [L1, L2, name]){ const s = String(x || '').split(';')[0].trim(); if(s && !out.includes(s)) out.push(s); }
  if(!out.length) out.push(name || a.country || '지역');
  return out.slice(0, 3);
}
function areasSummary(t){
  const tops = [];
  for(const a of areaIds(t)){ const top = t.areas[a].path[0]; if(!tops.includes(top)) tops.push(top); }
  return tops.length ? tops.slice(0, 2).join(', ') + (tops.length > 2 ? ` 외 ${tops.length-2}` : '') : '';
}
function areaOptions(t, sel, autoLabel){
  let h = autoLabel != null ? `<option value="">${esc(autoLabel)}</option>` : '';
  for(const n of areaTree(t)) if(n.aid) h += `<option value="${esc(n.aid)}"${n.aid === sel ? ' selected' : ''}>${'  '.repeat(n.depth)}${esc(n.label)}</option>`;

/* ================= 변경 기록(ops) ================= */
const opSet = (path, v) => ({p:path.map(String), v:clone(v)});
const opDel = path => ({p:path.map(String)});
function applyOps(doc, ops){
  if(!Array.isArray(ops)) return;
  for(const o of ops){
    if(!isObj(o) || !Array.isArray(o.p) || !o.p.length || o.p.length > 4 || o.p.some(k => (typeof k !== 'string' && typeof k !== 'number') || BAD_KEYS.has(String(k)))) continue;
    const p = o.p.map(String);
    let cur = doc, ok = true;
    for(let i = 0; i < p.length-1; i++){
      const k = p[i];
      if(!isObj(cur[k])){
        if(!('v' in o) || (i === 1 && ENTITY.has(p[0]))){ ok = false; break; }   // 지워진 장소·사람·지역은 되살리지 않음(서버와 같은 규칙)
        cur[k] = {};
      }
      cur = cur[k];
    }
    if(!ok) continue;
    const last = p[p.length-1];
    if('v' in o) cur[last] = scrub(clone(o.v)); else delete cur[last];
  }
}
function commit(ops, {render = true} = {}){
  const tid = S.cur, t = S.trips[tid]; if(!t || !ops.length) return;
  applyOps(t, ops); normDoc(t); save();
  if(isShared(tid)) Sync.push(tid, ops);
  else if(Sync.pending[tid]) Sync.pending[tid].push(...clone(ops));   // 공유 시작(업로드) 중에 고친 것
  if(render) renderAll();
}

/* ================= 함께 쓰기(Supabase) ================= */
const Sync = {
  sb:null, ch:{}, timers:{}, busy:{}, loading:{}, want:{}, pending:{}, online:{}, locs:{}, status:'',
  init(){
    try{ if(window.supabase && CONFIG.SUPA_KEY) this.sb = window.supabase.createClient(CONFIG.SUPA_URL, CONFIG.SUPA_KEY, {auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false}}); }
    catch(e){ console.warn('supabase', e); }
  },
  st(tid){ return S.sync[tid] || (S.sync[tid] = {rev:0, q:[]}); },
  async rpc(fn, args){
    if(!this.sb) throw new Error('공유 서버가 설정되지 않았어요');
    const {data, error} = await this.sb.rpc(fn, args);
    if(error) throw new Error(error.message || String(error));
    return data;
  },
  // 공유 시작: 올리는 동안 고친 내용은 pending 에 모았다가 올린 뒤 이어서 보낸다
  async create(tid){
    this.pending[tid] = [];
    try{ await this.rpc('trip_create', {p_id:tid, p_data:clone(S.trips[tid])}); }
    catch(e){ delete this.pending[tid]; throw e; }
    const q = this.pending[tid] || []; delete this.pending[tid];
    S.sync[tid] = {rev:1, q}; save(); this.watch(tid);
    if(tid === S.cur) this.setStatus(q.length ? 'saving' : 'live');
    if(q.length) this.flush(tid);
  },
  load(tid){
    if(this.loading[tid]) return this.loading[tid];
    const pr = (async () => {
      const data = await this.rpc('trip_get', {p_id:tid});
      if(!isObj(data) || !isObj(data.data)) return false;
      if(!S.sync[tid]) return false;   // 그 사이 목록에서 뺀 여행
      const st = this.st(tid), first = !st.rev, rev = +data.rev || 0;
      if(rev < st.rev) return true;   // 더 오래된 응답
      const doc = normDoc(scrub(data.data));
      applyOps(doc, st.q); normDoc(doc);
      S.trips[tid] = doc; st.rev = rev;
      if(!S.order.includes(tid)) S.order.push(tid);
      save();
      if(tid === S.cur){ this.setStatus(st.q.length ? 'saving' : 'live'); scheduleRender(); if(first) setTimeout(() => ensureMe(tid), 0); }
      else if(first) renderHeader();
      return true;
    })();
    this.loading[tid] = pr;
    pr.then(ok => {
      this.loading[tid] = null;
      if(ok && S.sync[tid] && (this.want[tid] || 0) > this.st(tid).rev) this.load(tid).catch(() => {});   // 받는 사이 더 새 변경이 있었으면 한 번 더
    }, () => { this.loading[tid] = null; });
    return pr;
  },
  reload(tid){ Promise.resolve(this.loading[tid]).catch(() => {}).then(() => this.load(tid)).catch(() => {}); },
  watch(tid){
    if(!this.sb || this.ch[tid]) return;
    const ch = this.sb.channel('trip-' + tid, {config:{presence:{key:CID}, broadcast:{self:false}}});
    ch.on('broadcast', {event:'patch'}, m => this.onPatch(tid, m && m.payload));
    ch.on('presence', {event:'sync'}, () => {
      const ps = ch.presenceState();
      this.online[tid] = new Set(Object.values(ps).flat().map(x => x && typeof x.mid === 'string' ? x.mid : null).filter(Boolean));
      // 위치를 공유 중인 사람(다른 창만). 받은 값은 믿지 않고 모양을 확인
      const locs = {};
      for(const [key, arr] of Object.entries(ps)){
        if(key === CID) continue;
        for(const x of arr){
          const l = x && x.loc;
          if(!x || typeof x.mid !== 'string' || !isObj(l) || !Number.isFinite(l.lat) || !Number.isFinite(l.lng) || Math.abs(l.lat) > 90 || Math.abs(l.lng) > 180) continue;
          const v = {lat:l.lat, lng:l.lng, acc:Number.isFinite(l.acc) ? Math.min(5000, Math.max(0, l.acc)) : 0, t:Number.isFinite(l.t) ? l.t : Date.now()};
          if(!locs[x.mid] || v.t > locs[x.mid].t) locs[x.mid] = v;
        }
      }
      this.locs[tid] = locs;
      if(tid === S.cur){ renderPeople(); Loc.draw(); }
    });
    ch.subscribe(s => {
      if(s === 'SUBSCRIBED'){ this.track(tid); this.load(tid).catch(() => {}); this.flush(tid); }
      else if((s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') && tid === S.cur) this.setStatus('off');
    });
    this.ch[tid] = ch;
  },
  unwatch(tid){ const ch = this.ch[tid]; if(ch){ try{ this.sb.removeChannel(ch); }catch(e){} delete this.ch[tid]; } },
  track(tid){ const ch = this.ch[tid], me = S.me[tid]; if(ch && me && tid === S.cur) ch.track(Object.assign({mid:me}, Loc.payload())).catch(() => {}); },   // '지금 보는 중'(+공유를 켰으면 내 위치)은 보고 있는 여행에만
  untrack(tid){ const ch = this.ch[tid]; if(ch) ch.untrack().catch(() => {}); },
  onPatch(tid, m){
    const t = S.trips[tid]; if(!t || !S.sync[tid] || !isObj(m) || typeof m.rev !== 'number') return;
    const st = this.st(tid);
    if(m.rev <= st.rev) return;
    if(m.rev !== st.rev + 1){ this.want[tid] = Math.max(this.want[tid] || 0, m.rev); this.load(tid).catch(() => {}); return; }   // 빠진 변경이 있으면 통째로 다시 받기
    applyOps(t, m.ops); applyOps(t, st.q); normDoc(t); st.rev = m.rev; save();
    if(tid === S.cur && m.by !== CID && Array.isArray(m.ops)) notifyAdds(t, m.ops);
    if(tid === S.cur) scheduleRender();
  },
  push(tid, ops){
    const st = this.st(tid); st.q.push(...clone(ops)); save();
    if(tid === S.cur) this.setStatus('saving');
    clearTimeout(this.timers[tid]); this.timers[tid] = setTimeout(() => this.flush(tid), 300);
  },
  // 보내는 묶음에는 번호(bid)를 붙여 저장해 둔다 → 응답을 못 받아 다시 보내도 서버가 한 번만 적용
  async flush(tid){
    if(!this.sb || this.busy[tid]) return;
    const st = S.sync[tid]; if(!st) return;
    if(!st.q.length){ st.inflight = null; return; }
    this.busy[tid] = true;
    if(!isObj(st.inflight) || !(st.inflight.n > 0) || st.inflight.n > st.q.length){ st.inflight = {id:uid(16), n:Math.min(st.q.length, 300)}; save(); }
    const n = st.inflight.n, ops = st.q.slice(0, n);
    let again = false;
    try{
      const r = await this.rpc('trip_patch', {p_id:tid, p_ops:ops, p_by:CID, p_bid:st.inflight.id});
      st.q.splice(0, n); st.inflight = null; save(); again = st.q.length > 0;
      if(typeof r === 'number' && st.rev > r) this.reload(tid);   // 내 묶음이 더 새 변경 위에 덮였으면 다시 맞추기
      if(tid === S.cur) this.setStatus(again ? 'saving' : 'live');
    }catch(e){
      if(/NOT_FOUND/.test(e.message)){ st.q = []; st.inflight = null; save(); toast('서버에서 이 여행을 찾을 수 없어요'); }
      else { if(tid === S.cur) this.setStatus('off'); clearTimeout(this.timers[tid]); this.timers[tid] = setTimeout(() => this.flush(tid), 5000); }
    }finally{ this.busy[tid] = false; }
    if(again) this.flush(tid);
  },
  async flushAll(tid, ms = 15000){   // 모두 보낼 때까지 기다리기(파일판 → 인터넷 주소로 옮길 때)
    const end = Date.now() + ms;
    while(S.sync[tid]?.q.length && Date.now() < end){ clearTimeout(this.timers[tid]); if(!this.busy[tid]) await this.flush(tid); else await sleep(150); if(S.sync[tid]?.q.length) await sleep(300); }
    return !S.sync[tid]?.q.length;
  },
  async poll(){
    const tid = S.cur; if(!tid || !S.sync[tid] || !this.sb || document.hidden) return;
    try{
      const rev = await this.rpc('trip_rev', {p_id:tid});
      if(typeof rev === 'number' && rev > this.st(tid).rev) await this.load(tid);
      else if(this.status === 'off') this.setStatus(S.sync[tid]?.q.length ? 'saving' : 'live');
      if(S.sync[tid]?.q.length) this.flush(tid);
    }catch(e){ if(tid === S.cur) this.setStatus('off'); }
  },
  setStatus(s){ this.status = s; renderSync(); },
};
// 친구가 장소를 넣으면 알려 주기
function notifyAdds(t, ops){
  const me = S.me[S.cur], added = [];
  for(const o of ops){
    if(isObj(o) && Array.isArray(o.p) && o.p.length === 2 && o.p[0] === 'places' && isObj(o.v) && typeof o.v.by === 'string' && o.v.by !== me && t.places[o.p[1]]) added.push(o.v);
  }
  if(!added.length) return;
  const who = [...new Set(added.map(v => mName(t, v.by)))].join('·');
  toast(added.length === 1 ? `${who}님이 ‘${String(added[0].name || '')}’을(를) 추가했어요` : `${who}님이 ${added.length}곳을 추가했어요`, 3500);
}

async function getJSON(url, opt){
  const sig = (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) ? {signal:AbortSignal.timeout(15000)} : {};
  const r = await fetch(url, Object.assign(sig, opt));
  let j = null; try{ j = await r.json(); }catch(e){}
  if(!r.ok) throw new Error((j && (j.error?.message || j.message || j.error)) || ('HTTP '+r.status));
  return j;
}
let nomLast = 0;
async function nominatim(path, params){   // 이용 규칙: 1초에 한 번
  const at = Math.max(Date.now(), nomLast + 1100); nomLast = at;
  const wait = at - Date.now(); if(wait > 0) await sleep(wait);
  return getJSON(`https://nominatim.openstreetmap.org/${path}?` + new URLSearchParams(params));
}
function catFromOSM(c, t){
  if(c === 'amenity' && /restaurant|fast_food|food_court|bar|pub|biergarten|ice_cream/.test(t)) return 'food';
  if(c === 'amenity' && t === 'cafe') return 'cafe';
  if(c === 'tourism' && /hotel|hostel|guest_house|apartment|motel|chalet/.test(t)) return 'stay';
  if(c === 'tourism' || c === 'historic' || c === 'natural' || (c === 'leisure' && /park|garden|nature_reserve/.test(t)) || (c === 'amenity' && /place_of_worship|theatre|arts_centre/.test(t))
    || (c === 'man_made' && /tower|lighthouse|observatory|bridge/.test(t)) || (c === 'waterway' && t === 'canal') || (c === 'boundary' && t === 'national_park')) return 'sight';
  if(c === 'shop') return 'shop';
  if(/railway|public_transport|aeroway/.test(c) || (c === 'amenity' && /bus_station|ferry_terminal/.test(t))) return 'move';
  return 'etc';
}
// 장소 종류에 따라 머무는 시간 기본값(분): 테마파크 하루, 수족관·동물원 3시간, 박물관 2시간 …
function stayFromType(t){
  t = String(t || '');
  if(/theme_park|amusement_park|water_park/.test(t)) return 480;
  if(/zoo|aquarium/.test(t)) return 180;
  if(/museum|gallery|art_gallery/.test(t)) return 120;
  if(/viewpoint|observation/.test(t)) return 45;
  if(/spa|onsen|hot_spring/.test(t)) return 120;
  return null;
}
function catFromGoogle(types){
  const has = re => (types||[]).some(x => re.test(x));
  if(has(/lodging|hotel/)) return 'stay';
  if(has(/cafe|coffee|bakery|tea_house|dessert/)) return 'cafe';
  if(has(/restaurant|food|meal|bar$|pub/)) return 'food';
  if(has(/transit_station|train_station|subway|airport|bus_station|ferry/)) return 'move';
  if(has(/shopping|store|market|department/)) return 'shop';
  if(has(/tourist|museum|park|worship|temple|shrine|church|amusement|zoo|aquarium|art_gallery|landmark|castle|historical/)) return 'sight';
  return 'etc';
}
async function nominatimSearch(q, near){
  const p = {q, format:'jsonv2', limit:near && near.bounded ? '20' : '8', 'accept-language':'ko', addressdetails:'1', extratags:'1'};
  if(near){
    if(near.tight){ const k = 0.02; p.viewbox = `${near.lng-k},${near.lat+k},${near.lng+k},${near.lat-k}`; p.bounded = '1'; }
    else if(near.bounded){   // 여행 지역 안에서만(지역 경계 + 여유, 최소 반경 약 40km)
      let [s0, n0, w0, e0] = okBBox(near.bbox) && (near.bbox[1]-near.bbox[0]) < 3 ? near.bbox : [near.lat, near.lat, near.lng, near.lng];
      const k = 0.35; s0 = Math.min(s0, near.lat - k); n0 = Math.max(n0, near.lat + k); w0 = Math.min(w0, near.lng - k); e0 = Math.max(e0, near.lng + k);
      p.viewbox = `${w0},${n0},${e0},${s0}`; p.bounded = '1';
    }
    else if(okBBox(near.bbox) && (near.bbox[1]-near.bbox[0]) < 3){ const [s,n,w,e] = near.bbox; p.viewbox = `${w},${n},${e},${s}`; }
    else { const k = 0.4; p.viewbox = `${near.lng-k},${near.lat+k},${near.lng+k},${near.lat-k}`; }
  }
  const j = await nominatim('search', p);
  return (j || []).map(r => {
    const name = String(r.name || r.display_name.split(',')[0]).split(';')[0];
    const oh = r.extratags?.opening_hours;
    return {
      name, addr:r.display_name, lat:+r.lat, lng:+r.lon, cat:catFromOSM(r.category, r.type), cc:r.address?.country_code || '', stay:stayFromType(r.type),
      rank:r.place_rank ?? 30, imp:+r.importance || 0, kind:r.category, address:r.address || {}, bbox:(r.boundingbox || []).map(Number),
      hours:hoursFromOSM(oh), hoursText:oh || ''
    };
  });
}

  if(/referer|referrer/i.test(m)) return '구글 키의 웹사이트 제한에 이 사이트 주소(mj-yeohaeng.pages.dev)가 빠져 있어요';

}

// 비용 = 이동 시간 + 벌점(문 닫은 시간 도착, 식사 시간에서 먼 식당, 중간에 끼인 숙소)
function planCost(order, ps, M, cfg, dow){
  let t = toMin(cfg.start), cost = 0;
  for(let i = 0; i < order.length; i++){
    const p = ps[order[i]];
    if(i > 0){ const s = M[order[i-1]][order[i]]; cost += s; t += s/60; }
    const stay = stayOf(p);
    if(p.hours && dow != null && !isOpenAt(p.hours, dow, t, Math.min(stay, 60))){
      const nx = nextOpen(p.hours, dow, t);
      if(nx != null && nx - t <= 120){ cost += (nx - t)*60; t = nx; }
      else cost += 4*3600;
    }
    if(p.cat === 'food' && !WHEN[p.when]){ const dm = Math.min(Math.abs(t - 750), Math.abs(t - 1110)); if(dm > 60) cost += (dm - 60)*40; }
    if(WHEN[p.when]){ const dm = Math.abs(t - WHEN[p.when].t); if(dm > 60) cost += (dm - 60)*60; }   // 원하는 시간대(아침·저녁·야경 등)
    if(p.cat === 'stay' && i > 0 && i < order.length-1) cost += 3600;
    t += stay;
  }
  if(Number.isFinite(cfg.deadline) && t > cfg.deadline) cost += (t - cfg.deadline) * 600;   // 비행기 놓치지 않게(마지막 날)
  return cost;
}
const travelOf = (order, M) => order.slice(0, -1).reduce((c, x, i) => c + M[x][order[i+1]], 0);
function solvePlan(ps, M, cfg, dow){
  const n = ps.length, all = [...Array(n).keys()];
  const fixS = !!cfg.fixS, fixE = !!cfg.fixE && n > (fixS ? 2 : 1);
  const cost = o => planCost(o, ps, M, cfg, dow);
  const head = fixS ? [0] : [], tail = fixE ? [n-1] : [];
  const mid = all.filter(i => !(fixS && i === 0) && !(fixE && i === n-1));
  let best = all.slice(), bestC = cost(best);
  if(mid.length <= 8){
    const arr = mid.slice();
    const perm = k => {
      if(k === arr.length){ const o = head.concat(arr, tail), c = cost(o); if(c < bestC - 1e-6){ bestC = c; best = o; } return; }
      for(let i = k; i < arr.length; i++){ [arr[k], arr[i]] = [arr[i], arr[k]]; perm(k+1); [arr[k], arr[i]] = [arr[i], arr[k]]; }
    };
    perm(0);
    return best;
  }
  for(const s0 of (fixS ? [0] : mid.slice(0, 12))){
    const left = new Set(mid); left.delete(s0);
    const o = [s0];
    while(left.size){ const last = o[o.length-1]; let nb = null; for(const j of left) if(nb === null || M[last][j] < M[last][nb]) nb = j; o.push(nb); left.delete(nb); }
    if(fixE) o.push(n-1);
    let improved = true, rounds = 0;
    while(improved && rounds++ < 50){
      improved = false;
      const lo = fixS ? 1 : 0, hi = o.length - (fixE ? 1 : 0);
      for(let i = lo; i < hi-1; i++) for(let k = i+1; k < hi; k++){
        const c = o.slice(0, i).concat(o.slice(i, k+1).reverse(), o.slice(k+1));
        if(cost(c) + 1e-6 < cost(o)){ o.splice(0, o.length, ...c); improved = true; }
      }
      for(let i = lo; i < hi; i++) for(let j = lo; j < hi; j++){   // 한 곳을 다른 자리로 옮겨 보기
        if(i === j) continue;
        const c = o.slice(); const [x] = c.splice(i, 1); c.splice(j, 0, x);
        if(cost(c) + 1e-6 < cost(o)){ o.splice(0, o.length, ...c); improved = true; }
      }
    }
    const c = cost(o); if(c < bestC){ bestC = c; best = o.slice(); }
  }
  return best;
}
async function optimizeDay(d, quiet, whoOverride, cfgOver){
  const tid = S.cur; let t = trip(); if(!t) return;
  const who = whoOverride || (multi(t) ? view.who : 'all'), cfg = Object.assign(effCfg(t, d), cfgOver || {});
  let ps = seqFor(t, d, who);
  const fs0 = flightStops(t, d);
  if(ps.length < (cfg.fixS && !fs0.pre ? 3 : 2)){ if(!quiet) toast('순서를 바꿀 장소가 부족해요'); return; }
  if(!quiet) toast('동선 계산 중…', 15000);
  const {fs, full} = withFlights(t, d, ps), o = fs.pre ? 1 : 0;   // 첫날·마지막 날은 공항이 고정된 처음·끝
  const M = await durationMatrix(full, cfg.mode);
  if(cfg.mode !== 'car') full.forEach((a, i) => full.forEach((b, j) => {   // 공항 오가는 구간은 걷기가 아니라 공항철도 정도로(경로 계산과 같은 규칙)
    if(i !== j && (a.virtual || b.virtual)) M[i][j] = estimateVia(a, b, 'train').dur;
    else if(i !== j && cfg.mode === 'foot' && M[i][j] > WALK_MAX && !VIA[isObj(b.via) ? b.via.m : '']) M[i][j] = Math.min(M[i][j], estimateVia(a, b, farMode(a, b)).dur);   // 먼 곳은 지하철
  }));
  if(S.cur !== tid) return;
  t = trip(); const ids = ps.map(p => p.id);
  ps = ids.map(id => t.places[id]).filter(p => p && effDay(t, p) === d);
  if(ps.length !== ids.length){ if(!quiet) toast('그 사이 일정이 바뀌어서 다시 눌러 주세요'); return; }
  const fullNow = (fs.pre ? [fs.pre] : []).concat(ps, fs.post ? [fs.post] : []);
  const cfgS = Object.assign({}, cfg, fs.pre ? {fixS:true} : {}, fs.post ? {fixE:true} : {});
  const orderF = solvePlan(fullNow, M, cfgS, dayDow(t, d));
  const order = orderF.filter(i => !fullNow[i].virtual).map(i => i - o);
  const before = travelOf([...fullNow.keys()], M), after = travelOf(orderF, M);
  const ops = [];
  let slots = ps.map(p => +p.ord || 0).sort((a, b) => a - b);
  if(new Set(slots).size !== slots.length){   // 순서값이 겹치면 그날 전체를 다시 번호 매김
    const full = dayPlaces(t, d);
    full.forEach((p, i) => { ops.push(opSet(['places', p.id, 'ord'], (i+1)*1000)); });
    applyOps(t, ops.slice());
    slots = ps.map(p => +p.ord).sort((a, b) => a - b);
  }
  order.forEach((i, j) => { if(+ps[i].ord !== slots[j]) ops.push(opSet(['places', ps[i].id, 'ord'], slots[j])); });
  if(ops.length) commit(ops);
  if(!quiet){
    const moved = order.some((x, i) => x !== i);
    toast(!moved ? '지금 순서가 이미 가장 알맞아요' : (after < before - 30 ? `순서를 바꿨어요 · 이동 ${fmtDur(before)} → ${fmtDur(after)}` : '식사·영업시간을 고려해 순서를 바꿨어요'));
  }
}
// 보관함 → 날짜 나누기(가까운 곳끼리, 하루 분량 고르게, 날짜에 정한 지역 지키기) → 날마다 순서 정하기
async function autoPlan(opts = {}){
  const tid = S.cur, t = trip(); if(!t) return;
  const pool = dayPlaces(t, 0).filter(p => !opts.ids || opts.ids.includes(p.id));
  if(!pool.length){ if(!opts.quiet) toast('보관함이 비어 있어요'); return; }
  const k = nDays(t), days = [...Array(k).keys()].map(i => i+1);
  const dayPath = d => pathOf(t, dayCfg(t, d).area);
  const cands = new Map(pool.map(p => {
    const ap = pathOf(t, areaOf(t, p));
    return [p.id, days.filter(d => { const dp = dayPath(d); return !dp || (ap && startsWith(ap, dp)); })];
  }));
  const load = p => stayOf(p) + 30;
  const fixed = {}, cents = {};
  for(const d of days){
    const ps = dayPlaces(t, d); fixed[d] = ps.reduce((s, p) => s + load(p), 0);
    if(ps.length) cents[d] = centroid(ps);
    else if(dayPath(d)){ const a = t.areas[dayCfg(t, d).area]; cents[d] = {lat:a.lat, lng:a.lng}; }
  }
  const hasAreas = areaIds(t).length > 0;
  const seedable = p => !hasAreas || !!areaOf(t, p);   // 지역 밖 먼 곳(예: 다른 나라)을 하루의 시작점으로 삼지 않기
  for(const d of days){
    if(cents[d]) continue;
    const used = Object.values(cents); let far = null, fd = -1;
    for(const p of pool){
      if(!cands.get(p.id).includes(d) || !seedable(p)) continue;
      const m = used.length ? Math.min(...used.map(c => hav(c, p))) : 0;
      if(m > fd){ fd = m; far = p; }
    }
    if(far) cents[d] = {lat:far.lat, lng:far.lng};
  }
  const total = pool.reduce((s, p) => s + load(p), 0) + Object.values(fixed).reduce((a, b) => a + b, 0);
  const cap0 = total / k * 1.15, FAR = 150000;   // 하루 동선에서 150km 넘게 떨어진 곳은 같은 날에 넣지 않음
  const capW = dayCapW(t), cap = d => cap0 * capW(d);   // 비행기 타는 날은 그만큼 적게
  let assign = new Map();
  for(let it = 0; it < 30; it++){
    const used = Object.assign({}, fixed), next = new Map(), pairs = [];
    const empty = d => used[d] === 0;
    for(const p of pool) for(const d of cands.get(p.id)) if(cents[d]) pairs.push([hav(cents[d], p), p, d]);
    pairs.sort((a, b) => a[0] - b[0]);
    for(const [dist, p, d] of pairs){ if(next.has(p.id) || used[d] + load(p) > cap(d) || dist > FAR) continue; next.set(p.id, d); used[d] += load(p); }
    for(const p of pool){
      if(next.has(p.id)) continue;
      const cs = cands.get(p.id).filter(d => (cents[d] && !empty(d) && hav(cents[d], p) <= FAR) || (empty(d) && seedable(p))); if(!cs.length) continue;
      let bd = cs[0]; for(const d of cs) if(used[d] / capW(d) < used[bd] / capW(bd)) bd = d;
      next.set(p.id, bd); used[bd] += load(p); if(!cents[bd] || empty(bd)) cents[bd] = {lat:p.lat, lng:p.lng};
    }
    for(const d of days){ const mem = dayPlaces(t, d).concat(pool.filter(p => next.get(p.id) === d)); if(mem.length) cents[d] = centroid(mem); }
    const same = next.size === assign.size && [...next].every(([id, d]) => assign.get(id) === d);
    assign = next; if(same) break;
  }
  const touched = [...new Set(assign.values())].sort((a, b) => a - b);
  const wasEmpty = new Set(days.filter(d => !dayPlaces(t, d).length));   // 비어 있던 날은 첫 장소를 고정하지 않고 통째로 순서 정하기
  const ops = [], base = {};
  for(const p of pool){
    const d = assign.get(p.id); if(!d) continue;
    base[d] = (base[d] ?? maxOrd(t, d)) + 1000;
    ops.push(opSet(['places', p.id, 'day'], d), opSet(['places', p.id, 'ord'], base[d]));
  }
  if(ops.length) commit(ops);
  if(ops.length && !opts.quiet) toast('날짜를 나눴어요. 날마다 순서 정하는 중…', 15000);
  for(const d of touched){ if(S.cur !== tid) return; await optimizeDay(d, true, 'all', wasEmpty.has(d) ? {fixS:false, fixE:false} : null); }
  if(S.cur !== tid) return;
  const left = pool.length - assign.size;
  toast(`${assign.size}곳을 ${touched.length}일에 나눠 순서까지 정했어요` + (left ? ` · ${left}곳은 멀거나 맞는 날짜가 없어 보관함에 남겼어요` : ''), 4000);
}

// 일정에 끼워 넣기: 이미 짜 둔 날의 순서는 건드리지 않고, 새 장소마다 '가장 덜 돌아가는' 날·자리를 찾아 끼워 넣는다
function insertIntoPlan(ids){
  const t = trip(); if(!t) return;
  const k = nDays(t), days = [...Array(k).keys()].map(i => i+1);
  const news = ids.map(id => t.places[id]).filter(p => p && effDay(t, p) === 0);
  if(!news.length){ toast('끼워 넣을 장소가 없어요'); return; }
  const lists = {}; for(const d of days) lists[d] = dayPlaces(t, d).slice();
  const load = p => stayOf(p) + 30, dayLoad = d => lists[d].reduce((s, p) => s + load(p), 0);
  const capW = dayCapW(t), cap0 = (days.reduce((s, d) => s + dayLoad(d), 0) + news.reduce((s, p) => s + load(p), 0)) / k * 1.15;
  const dayPath = d => pathOf(t, dayCfg(t, d).area);
  const isNew = new Set(news.map(p => p.id)), placed = [];
  let left = 0;
  // 기존 일정과 가까운 곳부터(자리 찾기가 쉬운 순서)
  const nearest = p => Math.min(...days.flatMap(d => lists[d].map(q => hav(p, q))), Infinity);
  for(const p of news.slice().sort((a, b) => nearest(a) - nearest(b))){
    const ap = pathOf(t, areaOf(t, p)); let best = null;
    for(const d of days){
      const dp = dayPath(d); if(dp && !(ap && startsWith(ap, dp))) continue;
      const L = lists[d], over = Math.max(0, dayLoad(d) + load(p) - cap0 * capW(d)) * 150;   // 하루가 너무 꽉 차면 벌점(분→m 환산)
      if(!L.length){ const c = 6000 + over; if(!best || c < best.c) best = {d, i:0, c}; continue; }   // 빈 날은 기존 일정 근처가 아닐 때만
      const fs = flightStops(t, d);
      for(let i = 0; i <= L.length; i++){
        const a = L[i-1] || (i === 0 ? fs.pre : null), b = L[i] || (i === L.length ? fs.post : null);   // 첫날·마지막 날은 공항도 이웃
        let c = (a ? hav(a, p) : 0) + (b ? hav(p, b) : 0) - (a && b ? hav(a, b) : 0);
        if(i === 0 && !fs.pre && dayCfg(t, d).fixS) c += 1e6;              // 첫 장소 고정이면 맨 앞에는 안 넣음
        if(i === L.length && !fs.post && dayCfg(t, d).fixE) c += 1e6;      // 마지막 고정이면 맨 뒤에는 안 넣음
        c += over;
        if(!best || c < best.c) best = {d, i, c};
      }
    }
    if(!best || best.c >= 1e6){ left++; continue; }   // 넣을 수 있는 자리가 없음(첫·마지막 고정 등)
    lists[best.d].splice(best.i, 0, p); placed.push(best.d);
  }
  // 새로 넣은 곳의 순서값: 기존 장소 사이 빈 칸에 고르게
  const ops = [];
  for(const d of new Set(placed)){
    const L = lists[d]; let i = 0;
    while(i < L.length){
      if(!isNew.has(L[i].id)){ i++; continue; }
      let j = i; while(j < L.length && isNew.has(L[j].id)) j++;
      const lo = i > 0 ? +L[i-1].ord || 0 : null, hi = j < L.length ? +L[j].ord || 0 : null, n = j - i;
      for(let q = 0; q < n; q++){
        const ord = lo != null && hi != null ? lo + (hi - lo) * (q + 1) / (n + 1) : lo != null ? lo + 1000 * (q + 1) : hi - 1000 * (n - q);
        ops.push(opSet(['places', L[i+q].id, 'day'], d), opSet(['places', L[i+q].id, 'ord'], ord));
      }
      i = j;
    }
    const ords = L.map(p => { const o = ops.find(x => x.p[1] === p.id && x.p[2] === 'ord'); return o ? o.v : +p.ord || 0; });
    if(ords.some((o, x) => x > 0 && !(o > ords[x-1]))){   // 순서값이 겹치면 그날 전체 다시 번호
      for(let x = ops.length - 1; x >= 0; x--) if(ops[x].p[2] === 'ord' && L.some(p => p.id === ops[x].p[1])) ops.splice(x, 1);
      L.forEach((p, x) => { if(isNew.has(p.id)) ops.push(opSet(['places', p.id, 'day'], d)); ops.push(opSet(['places', p.id, 'ord'], (x + 1) * 1000)); });
    }
  }
  if(ops.length) commit(ops);
  const n = news.length - left;
  toast(n ? `${n}곳을 지금 일정 사이사이에 끼워 넣었어요 · 기존 순서는 그대로예요` + (left ? ` · ${left}곳은 맞는 날이 없어 보관함에 남겼어요` : '') : '맞는 날짜를 찾지 못했어요', 4000);
}

const Loc = {

  if(!confirm(`‘${p.name}’을(를) 삭제할까요?`)) return;
  view.open = null; commit([opDel(['places', id])]);
}

/* ================= 화면 ================= */
function renderHeader(){
  const sel = $('#tripSel');
  sel.innerHTML = S.order.filter(id => S.trips[id]).map(id => `<option value="${esc(id)}"${id === S.cur ? ' selected' : ''}>${esc(S.trips[id].meta?.name || '여행')}</option>`).join('')
    + `<option value="__new">+ 새 여행 만들기</option>`;
  if(!trip()) sel.value = '__new';
  const t = trip();
  let meta = '';
  if(t){
    const parts = [];
    if(t.meta.start){ const e = dayDateParts(t, nDays(t)); parts.push(`${esc(t.meta.start.replace(/-/g,'.'))} – ${e.m+1}.${e.d}`); }
    parts.push(`${nDays(t)}일`);
    const as = areasSummary(t); if(as) parts.push(esc(as));
    parts.push(`장소 ${placesArr(t).length}곳`);
    meta = parts.join(' · ');
  }
  $('#tripMeta').innerHTML = meta;
  $('#q').disabled = !t; $('#btnBulk').disabled = !t; $('#btnShare').disabled = !t;
  renderSync();
}
function renderSync(){
  const el = $('#sync'); if(!el) return;
  if(!trip() || !isShared()){ el.innerHTML = ''; return; }
  const s = Sync.status;
  el.innerHTML = s === 'off' ? `<i style="--c:#adb5bd"></i>오프라인 · 연결되면 저장` : s === 'saving' ? `<i style="--c:#f08c00"></i>저장 중` : `<i></i>함께 편집 중`;
}
function renderPeople(){
  const t = trip(), el = $('#people');
  if(!t || (!multi(t) && !isShared())){ el.innerHTML = ''; el.hidden = true; return; }
  el.hidden = false;
  if(view.who !== 'all' && !t.members[view.who]) view.who = 'all';
  const on = Sync.online[S.cur] || new Set(), me = S.me[S.cur];
  let h = multi(t) ? `<button class="pchip${view.who === 'all' ? ' on' : ''}" data-who="all">모두</button>` : '';
  for(const m of memberIds(t)){
    const live = on.has(m);
    const at = m === me ? (Loc.share && Loc.me) : (Sync.locs[S.cur] || {})[m];
    h += `<button class="pchip${view.who === m && multi(t) ? ' on' : ''}${live ? ' live' : ''}" data-who="${esc(m)}" style="--c:${mColor(t, m)}" title="${live ? '지금 보고 있어요' : ''}${at ? ' · 위치 공유 중' : ''}"><i class="pdot"></i>${esc(mName(t, m))}${m === me ? ' <small>나</small>' : ''}${at ? ' <span class="locon" aria-label="위치 공유 중"></span>' : ''}</button>`;
  }
  h += `<button class="pchip" data-act="share">+ 초대</button>`;

function renderSearchArea(){

  const note = via.note ? ` · ${esc(via.note)}` : '';

  if(open){
    h += `<div class="detail">`;

    h += `<div class="viaedit" data-via-for="${esc(b.id)}">
      <div class="vchips"><button data-via-m="" class="${VIA[via.m] ? '' : 'on'}">기본(${MODES[cfg.mode].label}${cfg.mode === 'foot' ? ' · 30분 넘으면 지하철' : ''})</button>${Object.entries(VIA).map(([k, v]) => `<button data-via-m="${k}" class="${via.m === k ? 'on' : ''}">${v.label}</button>`).join('')}</div>

    if(leg.auto) h += `<div class="hint" style="margin-bottom:6px">걸어서 ${fmtDur(leg.walkDur || WALK_MAX)} 넘게 걸려서 ${mlabel}${roJosa(mlabel)} 계산했어요. 걸어가려면 위에서 ‘도보’를 골라 주세요.</div>`;

  }
  return h + '</li>';

$('#panel').addEventListener('change', e => {

  }

});

let drag = null;
const ghost = $('#ghost');
function clearDropMarks(){ document.querySelectorAll('.over-top,.over-bot,.tab.drop').forEach(x => x.classList.remove('over-top','over-bot','drop')); }
$('#panel').addEventListener('pointerdown', e => {
  const g = e.target.closest('.grip'); if(!g || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const it = g.closest('.item'); if(!it) return;
  e.preventDefault();
  drag = {id:it.dataset.id, el:it, x:e.clientX, y:e.clientY, started:false, pid:e.pointerId, target:null};
  try{ g.setPointerCapture(e.pointerId); }catch(err){}
});
document.addEventListener('pointermove', e => {
  if(!drag || e.pointerId !== drag.pid) return;
  if(!drag.started){
    if(Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 4) return;
    drag.started = true; drag.el.classList.add('dragging'); document.body.classList.add('is-dragging');
    ghost.textContent = trip()?.places[drag.id]?.name || ''; ghost.style.display = 'block';
  }
  e.preventDefault();
  ghost.style.transform = `translate(${e.clientX + 14}px, ${e.clientY + 10}px)`;
  clearDropMarks(); drag.target = null;
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const tab = under && under.closest('#tabs [data-drop]');
  const item = under && under.closest('#panel .item');
  if(tab){ tab.classList.add('drop'); drag.target = {tab:+tab.dataset.drop}; }
  else if(item && item.dataset.id !== drag.id){
    const r = item.getBoundingClientRect(), after = e.clientY > r.top + r.height/2;
    item.classList.add(after ? 'over-bot' : 'over-top'); drag.target = {id:item.dataset.id, after};
  }
  const pr = $('#panel').getBoundingClientRect();
  if(e.clientY < pr.top + 40) $('#panel').scrollTop -= 14; else if(e.clientY > pr.bottom - 40) $('#panel').scrollTop += 14;
}, {passive:false});
function endDrag(e, cancel){
  if(!drag || (e && e.pointerId !== drag.pid)) return;
  const d = drag; drag = null;
  clearDropMarks(); d.el.classList.remove('dragging'); document.body.classList.remove('is-dragging'); ghost.style.display = 'none';
  if(!d.started || cancel || !d.target){ if(panelDirty) renderAll(); return; }
  if(d.target.tab != null){
    const t = trip(), p = t?.places[d.id];
    if(p && effDay(t, p) !== d.target.tab){ movePlace(d.id, d.target.tab); toast(`${d.target.tab ? d.target.tab + '일차' : '보관함'}로 옮겼어요`); }
    else if(panelDirty) renderAll();
  }
  else dropPlace(d.id, d.target.id, d.target.after);
}
document.addEventListener('pointerup', e => endDrag(e, false));
document.addEventListener('pointercancel', e => endDrag(e, true));

// 목적지 찾기: 한글 지명은 OSM에 '삿포로시'처럼 '시'까지 붙어 있어 '삿포로'로는 도시가 안 나온다 → '시'를 붙여 한 번 더 찾고, 도시·지역을 먼저 보여 준다.
async function destSearch(q){
  const qs = [q];
  if(/[가-힣]$/.test(q) && !/(시|군|구|도|현|부|주|성|동|읍|면|리|섬)$/.test(q)) qs.push(q + '시');
  const all = [];
  for(const x of qs){ try{ all.push(...await nominatimSearch(x)); }catch(e){ if(!all.length && x === qs[qs.length-1]) throw e; } }
  const seen = new Set(), out = [];
  for(const r of all){
    const k = r.name + '|' + r.lat.toFixed(2) + ',' + r.lng.toFixed(2);
    if(seen.has(k)) continue; seen.add(k); out.push(r);
  }
  const isArea = r => (r.kind === 'boundary' || r.kind === 'place') && r.rank <= 22;
  return out.sort((a, b) => (isArea(b) - isArea(a)) || (b.imp - a.imp));
}
function destPicker(m, onPick){
  let found = [];
  const run = async () => {
    const q = m.querySelector('#dq').value.trim(); if(!q) return;
    const box = m.querySelector('#dres'); box.innerHTML = '<div class="choice">찾는 중…</div>';
    try{ found = await destSearch(q); }catch(e){ box.innerHTML = `<div class="choice">검색 실패: ${esc(e.message)}</div>`; return; }
    box.innerHTML = found.length ? found.map((r, i) => `<div class="choice" data-i="${i}">${esc(pathFromAddress(r.name, r.address).join(' › '))}<small>${esc(r.addr)}</small></div>`).join('') : '<div class="choice">결과가 없어요</div>';
  };
  m.querySelector('#dbtn').onclick = run;
  m.querySelector('#dq').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); run(); } });
  m.querySelector('#dres').addEventListener('click', e => {
    const c = e.target.closest('[data-i]'); if(!c) return;
    m.querySelectorAll('#dres .choice').forEach(x => x.classList.remove('on')); c.classList.add('on');
    const r = found[+c.dataset.i]; if(!r) return;
    const area = {path:pathFromAddress(r.name, r.address), lat:r.lat, lng:r.lng, bbox:okBBox(r.bbox) ? r.bbox : null, tz:guessTz(r.cc, r.lat, r.lng), cc:r.cc};
    onPick(area);
    if(area.bbox && (area.bbox[1]-area.bbox[0]) > 0.01) map.fitBounds([[area.bbox[0], area.bbox[2]], [area.bbox[1], area.bbox[3]]], {padding:[20,20]}); else map.setView([r.lat, r.lng], 13);
  });
}

const KO_ORD = {첫:1, 둘:2, 셋:3, 넷:4, 다섯:5, 여섯:6, 일곱:7, 여덟:8, 아홉:9, 열:10};
function dayHead(s, t){
  let m = s.match(/^\s*(?:day\s*(\d{1,2})|(\d{1,2})\s*(?:일\s*차|일\s*째|번째\s*날|째\s*날))\s*[:：.)\-–]?\s*(.*)$/i);
  if(m) return {day:+(m[1] || m[2]), rest:m[3]};
  m = s.match(/^\s*(첫|둘|셋|넷|다섯|여섯|일곱|여덟|아홉|열)\s*(?:째|번째)\s*날\s*[:：.)\-–]?\s*(.*)$/);
  if(m) return {day:KO_ORD[m[1]], rest:m[2]};
  m = s.match(/^\s*(보관함|미정|아무\s*때나|날짜\s*미정|언제든)\s*[:：\-–]?\s*(.*)$/);

  m = s.match(/^\s*(\d{1,2})\s*(?:\/|\.|월)\s*(\d{1,2})\s*일?\s*(?:\([^)]*\))?\s*[:：\-–]\s*(.*)$/);   // 12/21: …  12월 21일(월): …

    const [y, mo, dd] = t.meta.start.split('-').map(Number);

function parseBulk(text, t){

  if(!ok.length) return Object.assign({}, rs[0], {far:true, farKm:Math.round(dist(rs[0])/1000)});
  const key = r => String(r.addr || r.name).split(',')[0].replace(/\s+/g, '');
  const same = ok.filter(r => key(r) === key(ok[0]));   // 같은 이름 지점이 여럿(체인점)이면 여행 지역 중심에서 가까운 곳
  return same.length > 1 ? same.sort((x, y) => hav(near, x) - hav(near, y))[0] : ok[0];
}

function catFromName(n){

  if(/호텔|hotel|ホテル|旅館|료칸|hostel|게스트하우스|guest ?house/.test(n)) return 'stay';
  if(/역$|駅|station|공항|空港|airport|터미널|terminal/.test(n)) return 'move';
  if(/공원|park|公園|신사|神社|jinja|寺|데라|사원|temple|shrine|탑$|tower|タワー|운하|canal|運河|곶$|岬|misaki|반도$|半島|해안|海岸|observation|전망|展望|대교|bridge|橋|온천|onsen|温泉|폭포|滝|호수|lake|湖|박물관|museum|美術館|미술관|gallery|성$|城|castle|garden|정원|庭園|야경|夜景|언덕|丘|hill|野草園|숲$|森|forest|동물원|zoo|수족관|aquarium|터널|tunnel|moss|이끼|[가-힣]{2,}(데라|사|지|인)$/.test(n)) return 'sight';
  if(/마트|mart|store|shop|빔스|beams|몽벨|mont-?bell|parco|파르코|팩토리|factory|휴먼 ?메이드|human ?made|liquor|百貨|백화점|시장|market|市場|아울렛|outlet|mall|몰$|드럭|drug|돈키|ドン・?キ|무인양품|無印|유니클로|uniqlo|potr|porter/.test(n)) return 'shop';
  return 'etc';
}
const LIST_LINK = /placelists\/list\/|!11m\d+!2s[A-Za-z0-9_-]{16}/;
const LIST_KO = {'want to go':'가고 싶은 장소', 'favorites':'즐겨찾기', 'favourites':'즐겨찾기', 'travel plans':'여행 계획', 'starred places':'별표 표시된 장소', 'saved places':'저장한 장소'};
const listTitle = s => LIST_KO[String(s || '').trim().toLowerCase()] || String(s || '').trim() || '구글 지도 목록';
async function resolveItem(it, near){
  if(it.kind === 'name'){ const rs = await searchPlaces(it.q, near); return pickNear(rs, near, trip()); }
  let g = parseGoogleUrl(it.url), info = {};
  if(!g || (g.lat == null && !g.name) || LIST_LINK.test(it.url)){
    try{ info = await resolveLink(it.url); g = parseGoogleUrl(info.url || '') || g; }catch(e){ if(LIST_LINK.test(it.url) || e.message === 'LIST_PRIVATE') return {listErr:e.message}; info = {}; }
  }
  if(info.list) return {list:{title:listTitle(info.list.title), items:Array.isArray(info.list.items) ? info.list.items : []}};   // 구글 지도 저장 목록 → 장소 여럿
  const name = (g && g.name) || info.title || it.hint || '';
  const lat = g && g.lat != null ? g.lat : +info.lat, lng = g && g.lng != null ? g.lng : +info.lng;
  if(Number.isFinite(lat) && Number.isFinite(lng)){
    if(name){
      try{ const rs = await searchPlaces(name, {lat, lng, tight:true, cc:near?.cc}); const b = rs.find(r => hav(r, {lat, lng}) < 400); if(b) return Object.assign({}, b, {lat, lng}); }catch(e){}
      return {name, addr:info.addr || it.addr || '', lat, lng, cat:CATS[info.cat] ? info.cat : 'etc'};
    }
    try{ const r = await reverseGeocode(lat, lng); return Object.assign({}, r, {lat, lng}); }catch(e){ return {name:'지도 링크 위치', addr:'', lat, lng, cat:'etc'}; }
  }
  if(name){ const bias = g && g.vlat != null ? {lat:g.vlat, lng:g.vlng, cc:near?.cc} : near; const rs = await searchPlaces(name, bias); if(rs[0]) return pickNear(rs, bias); }
  const addr = info.addr || it.addr;
  if(addr){ const rs = await searchPlaces(addr, near); if(rs[0]) return Object.assign({}, rs[0], {name:name || rs[0].name}); }
  return null;
}

// 항공권 캡쳐 글자(OCR) → 구간들. 공항 코드·시각을 짝지어 구간을 만들고, 편명·날짜는 가까운 것을 붙인다.
const AIRLINES = new Set('KE OZ 7C LJ TW ZE BX RS RF 4V YP JL NH MM BC GK 9C IJ HD 7G 6J CX KA HX UO VJ VN QH VU PR 5J Z2 TG FD WE XJ SL SQ TR 3K MH AK D7 CI BR IT JX CA MU CZ FM HO MF SC 3U ZH UA DL AA AC QF EK TK AF KL LH BA AY LO QR EY HA JQ OD NX 8M'.split(' '));
const FLIGHT_RE = /(?<![A-Z0-9])([A-Z]{2}|[A-Z][0-9]|[0-9][A-Z])\s?(\d{2,4})(?![0-9:])/g;
const MON = {JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
function parseBooking(text, opts = {}){
  const T = String(text || '').replace(/[|｜]/g, ' ').replace(/[０-９Ａ-Ｚ：]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/\r/g, '')
    .replace(/([가-힣])[ \t]+(?=[가-힣])/g, '$1')   // 글자 인식이 '청 주 국 제 공 항'처럼 띄운 것 붙이기
    .replace(/\n[ \t]*(?=\n)/g, '').replace(/\n{2,}/g, '\n');   // 빈 줄 없애기(줄 거리 계산)
  const lineOf = i => T.slice(0, i).split('\n').length - 1;
  const toks = [];
  const add = (type, v, i, len) => toks.push({type, v, i, len, line:lineOf(i), used:false});
  for(const m of T.matchAll(/(?<![A-Za-z])([A-Z]{3})(?![A-Za-z])/g)) if(AIRPORTS[m[1]]) add('ap', m[1], m.index, 3);
  // 한글 공항 이름: 정식 이름(예: 청주국제공항)은 늘, 짧은 도시 이름(예: 청주·삿포로)은 코드가 하나도 없을 때만.
  // '제주항공'·'에어부산'·'세부퍼시픽' 같은 항공사 이름은 공항으로 보지 않음
  const noCodes = !toks.length, taken = new Set();
  for(const [code, a] of Object.entries(AIRPORTS)) for(const al of [a[0]].concat(noCodes ? a[4].split(',') : [])){
    if(al.length < 2) continue;
    for(const m of T.matchAll(new RegExp(al.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'))){
      const after = T.slice(m.index + al.length, m.index + al.length + 4), before = T.slice(Math.max(0, m.index - 2), m.index);
      if(/^(항공|퍼시픽|익스프레스)/.test(after) || before === '에어') continue;
      if([...Array(al.length).keys()].some(k => taken.has(m.index + k))) continue;   // 더 긴 이름에 이미 들어간 자리
      const ln = lineOf(m.index);
      if(toks.some(x => x.type === 'ap' && x.v === code && x.line === ln && Math.abs(x.i - m.index) < 16)) continue;   // 'CTS 신치토세공항'은 하나로
      for(let k = 0; k < al.length; k++) taken.add(m.index + k);
      add('ap', code, m.index, al.length);
    }
  }
  for(const m of T.matchAll(FLIGHT_RE)) if(AIRLINES.has(m[1])) add('fl', m[1] + String(+m[2]), m.index, m[0].length);
  for(const m of T.matchAll(/(?<![\d:])([01]?\d|2[0-3])\s?[:：]\s?([0-5]\d)(?![\d:])/g)) add('tm', String(+m[1]).padStart(2, '0') + ':' + m[2], m.index, m[0].length);
  const Y0 = opts.year || new Date().getFullYear();
  const addDate = (y, mo, d, i, len) => { if(mo >= 1 && mo <= 12 && d >= 1 && d <= 31) add('dt', {y, m:mo, d}, i, len); };
  for(const m of T.matchAll(/(20\d{2})\s?[.\-/년]\s?(\d{1,2})\s?[.\-/월]\s?(\d{1,2})/g)) addDate(+m[1], +m[2], +m[3], m.index, m[0].length);
  for(const m of T.matchAll(/(?<![\d.\-/])(\d{1,2})\s?월\s?(\d{1,2})\s?일/g)) addDate(null, +m[1], +m[2], m.index, m[0].length);
  for(const m of T.matchAll(/(?<![A-Za-z\d])(\d{1,2})\s?(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[A-Z]*\.?\s?(\d{2,4})?/gi)) addDate(m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : null, MON[m[2].toUpperCase()], +m[1], m.index, m[0].length);
  for(const m of T.matchAll(/(?<![A-Za-z])(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[A-Z]*\.?\s(\d{1,2})(?!\d)/gi)) addDate(null, MON[m[1].toUpperCase()], +m[2], m.index, m[0].length);
  for(const m of T.matchAll(/(?<![\d.\-/:])(\d{1,2})[./](\d{1,2})\s?\(\s?[일월화수목금토]/g)) addDate(null, +m[1], +m[2], m.index, m[0].length);
  // 같은 자리를 두 번 읽은 날짜(예: '2026.10.24'와 '10.24(토)') 정리
  toks.sort((a, b) => a.i - b.i);
  for(let k = toks.length - 1; k > 0; k--){ const a = toks[k-1], b = toks[k]; if(a.type === 'dt' && b.type === 'dt' && b.i < a.i + a.len) toks.splice(k, 1); }
  const aps = toks.filter(x => x.type === 'ap'), tms = toks.filter(x => x.type === 'tm');
  // 공항마다 시각 하나: 같은 줄(순서대로) → 없으면 아래 두 줄 안(순서대로) → 위 한 줄
  const stops = [];
  const byLine = new Map(); for(const a of aps){ if(!byLine.has(a.line)) byLine.set(a.line, []); byLine.get(a.line).push(a); }
  const lines = [...byLine].sort((x, y) => x[0] - y[0]), done = new Set();
  const take = (ln, as, pool) => {
    done.add(ln);
    if(as.length === 1 && pool.length > 1){ const a = as[0], nb = pool.slice().sort((x, y) => Math.abs(x.i - a.i) - Math.abs(y.i - a.i))[0]; nb.used = true; stops.push({ap:a.v, tm:nb.v, i:a.i, line:ln}); return; }
    as.forEach((a, k) => { const t = pool[k]; if(t){ t.used = true; stops.push({ap:a.v, tm:t.v, i:a.i, line:ln}); } });
  };
  // 1) 공항과 시각이 같은 줄에 있는 줄 먼저 2) 나머지는 아래 두 줄 → 위 한 줄의 남은 시각(요약 머리줄이 시각을 가로채지 않게)
  for(const [ln, as] of lines){ const pool = tms.filter(x => !x.used && x.line === ln); if(pool.length) take(ln, as, pool); }
  for(const [ln, as] of lines){
    if(done.has(ln)) continue;
    for(const dl of [1, -1, 2, -2]){
      if(byLine.has(ln + dl) && tms.some(x => x.line === ln + dl && x.line !== ln) && done.has(ln + dl)) continue;   // 그 줄의 시각은 그 줄 공항 몫
      const pool = tms.filter(x => !x.used && x.line === ln + dl); if(pool.length){ take(ln, as, pool); break; }
    }
  }
  stops.sort((a, b) => a.i - b.i);
  const segs = [];
  for(let k = 0; k + 1 < stops.length; ){
    const a = stops[k], b = stops[k+1];
    if(a.ap !== b.ap){ segs.push({from:a.ap, dep:a.tm, to:b.ap, arr:b.tm, i:a.i, j:b.i}); k += 2; } else k += 1;
  }
  // 구간에 붙일 편명·날짜: 구간 안 → 바로 위(세 줄 안, 가까운 것) → 바로 아래(세 줄 안). 앞 구간이 쓴 것은 건너뜀
  const near = (type, i, j) => {
    const li = lineOf(i), lj = lineOf(j), c = toks.filter(x => x.type === type && !x.used);
    const inside = c.find(x => x.i >= i && x.i <= j); if(inside) return inside;
    const before = c.filter(x => x.i < i && x.line >= li - 3).pop(); if(before) return before;
    return c.find(x => x.i > j && x.line <= lj + 3) || null;
  };
  for(const s of segs){
    const f = near('fl', s.i, s.j); if(f){ f.used = true; s.no = f.v; }
    const d = near('dt', s.i, s.j); if(d){ d.used = true; s.date = d.v; }
  }
  // 연도 채우기: 없으면 앞 구간·힌트 연도, 지난 날짜면 다음 해
  let lastY = null;
  for(const s of segs){ if(!s.date) continue; if(s.date.y) lastY = s.date.y; else s.date.y = lastY || Y0; }
  const home = c => AIRPORTS[c] && AIRPORTS[c][3] === 'kr';
  let out = null, back = null;
  if(segs.length){
    let oi = segs.findIndex(s => home(s.from) && !home(s.to)); if(oi < 0) oi = 0;
    let oe = oi; while(oe + 1 < segs.length && segs[oe+1].from === segs[oe].to && !home(segs[oe].to) && !home(segs[oe+1].to) && segs[oe+1].to !== segs[oi].from) oe++;   // 경유
    out = {no:segs[oi].no || '', from:segs[oi].from, dep:segs[oi].dep, to:segs[oe].to, arr:segs[oe].arr, date:segs[oe].date || segs[oi].date || null, depDate:segs[oi].date || null};
    let bi = -1; for(let k = segs.length - 1; k > oe; k--) if(home(segs[k].to) && !home(segs[k].from)){ bi = k; break; }
    if(bi < 0 && segs.length > oe + 1) bi = segs.length - 1;
    if(bi >= 0){ let bs = bi; while(bs - 1 > oe && segs[bs-1].to === segs[bs].from && !home(segs[bs-1].from)) bs--; back = {no:segs[bs].no || '', from:segs[bs].from, dep:segs[bs].dep, to:segs[bi].to, arr:segs[bi].arr, date:segs[bs].date || null}; }
    // 밤을 넘겨 도착하면 도착 날짜 +1
    if(out && out.depDate && out.arr < out.dep && out.date === out.depDate){ const dd = new Date(Date.UTC(out.date.y, out.date.m - 1, out.date.d + 1)); out.date = {y:dd.getUTCFullYear(), m:dd.getUTCMonth() + 1, d:dd.getUTCDate()}; }
  }
  return {segs:segs.map(({i, j, ...s}) => s), out, back};
}

// 같은 캡쳐를 여러 방식으로 읽은 글자(한글 우선·영어 우선)를 합침: 가장 많이 읽힌 결과에 빠진 편명·날짜를 다른 쪽에서 채움
function readBooking(texts, opts){
  const rs = texts.map(x => parseBooking(x, opts));
  const score = r => (r.out ? 4 : 0) + (r.back ? 4 : 0) + [r.out, r.back].filter(Boolean).reduce((n, x) => n + (x.no ? 1 : 0) + (x.date ? 1 : 0), 0);
  const best = rs.slice().sort((a, b) => score(b) - score(a))[0];
  for(const k of ['out', 'back']){
    const x = best[k]; if(!x) continue;
    for(const r of rs){ const y = r[k]; if(!y || y === x || !(y.dep === x.dep || y.arr === x.arr)) continue; if(!x.no && y.no) x.no = y.no; if(!x.date && y.date) x.date = y.date; }
  }
  const nos = [];   // 그래도 편명이 없으면 글 전체에서 나온 편명을 차례대로(가는 편 = 처음, 오는 편 = 마지막)
  for(const x of texts) for(const m of String(x).matchAll(FLIGHT_RE)) if(AIRLINES.has(m[1])){ const v = m[1] + String(+m[2]); if(!nos.includes(v)) nos.push(v); }
  if(best.out && !best.out.no && nos.length) best.out.no = nos[0];
  if(best.back && !best.back.no){ const v = nos.filter(n => n !== best.out?.no).pop(); if(v) best.back.no = v; }
  return best;
}
const apOf = code => { const a = AIRPORTS[code]; return a ? {name:a[0], lat:a[1], lng:a[2]} : null; };
let ocrLoading = null;
async function ocrImage(file, onProgress){   // 무료 글자 인식(Tesseract.js, 처음 한 번 언어 자료 약 5MB 받음)
  if(!window.Tesseract){
    ocrLoading = ocrLoading || new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js'; sc.onload = res; sc.onerror = () => { ocrLoading = null; rej(new Error('글자 인식 도구를 못 불러왔어요')); }; document.head.appendChild(sc); });
    await ocrLoading;
  }
  // 두 번 읽음: 한글 우선(공항 이름·날짜) + 영어 우선(편명·공항 코드) → readBooking 이 합침
  const texts = [];
  for(const [k, langs] of [['kor', 'eng'], ['eng']].entries()){
    const w = await Tesseract.createWorker(langs, 1, {logger:m => { if(m && m.status === 'recognizing text' && onProgress) onProgress(Math.round((k + (m.progress || 0)) * 50)); }});
    try{ const r = await w.recognize(file); texts.push(String(r?.data?.text || '')); }
    finally{ w.terminate().catch(() => {}); }
  }
  return texts;
}

/* 날짜별 '+' → 그 날에 바로 장소 넣기(검색 또는 보관함에서 고르기) */
// 이 날 동선에서 가장 덜 돌아가는 자리(첫·마지막 고정은 지킴). fit=false 면 맨 뒤(마지막 고정이면 그 앞)
function daySlot(t, d, list, p, fit){
  const cfg = dayCfg(t, d), n = list.length, fs = flightStops(t, d);
  const lo = cfg.fixS && !fs.pre && n ? 1 : 0, hi = cfg.fixE && !fs.post && n > lo ? n - 1 : n;
  if(!fit) return hi;
  let best = hi, bc = Infinity;
  for(let i = lo; i <= hi; i++){

    const c = (a ? hav(a, p) : 0) + (b ? hav(p, b) : 0) - (a && b ? hav(a, b) : 0);
    if(c <= bc){ bc = c; best = i; }   // 같으면 뒤쪽
  }
  return best;
}
