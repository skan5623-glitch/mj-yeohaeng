  const opsFor = entries => {
    const t = trip(), list = dayPlaces(t, d).slice(), ops = [];
    for(const {p, isNew} of entries){
      const i = daySlot(t, d, list, p, fit()), ord = ordBetween(list, i);
      list.splice(i, 0, Object.assign({}, p, {ord}));
      if(isNew){ const np = makePlace(t, p, d, ord); ops.push(opSet(['places', np.id], np)); }
      else ops.push(opSet(['places', p.id, 'day'], d), opSet(['places', p.id, 'ord'], ord));
    }
    return ops;
  };
  const drawPool = () => {
    if(!alive()) return;
    const t = trip(), pool = dayPlaces(t, 0).filter(p => Number.isFinite(p.lat));
    for(const id of [...picked]) if(!pool.some(p => p.id === id)) picked.delete(id);
    const el = $m('#adPool');
    if(!pool.length){ el.innerHTML = ''; }
    else {
      const gap = gapFn(t), rows = pool.map(p => ({p, g:gap(p)})).sort((a, b) => a.g - b.g);
      el.innerHTML = `<div class="adsec"><b>보관함에서 고르기</b><span>${dayPlaces(t, d).length ? '이 날 동선에서 가까운 순' : '가까운 순'}</span></div>
        <div class="bklist" style="margin-top:6px">${rows.map(({p, g}) => `<label class="bkrow"><input type="checkbox" data-pk="${esc(p.id)}" ${picked.has(p.id) ? 'checked' : ''}><div class="t">${esc(p.name)}<small>${esc(CATS[p.cat]?.label || '')} · ${fmtDist(g)}${byOther(t, p) ? ' · ' + esc(mName(t, p.by)) + ' 추가' : ''}${p.memo ? ' · ' + esc(p.memo) : ''}</small></div></label>`).join('')}</div>`;
    }
    const b = $m('#adAdd'); b.hidden = !picked.size; b.textContent = `${picked.size}곳 넣기`;
  };
  const drawRes = msg => {
    if(!alive()) return;
    const el = $m('#adRes');
    if(msg){ el.innerHTML = `<div class="bkrow fail"><div class="t">${msg}</div></div>`; return; }
    el.innerHTML = results.map((r, i) => `<div class="bkrow"><div class="t">${esc(r.name)}${r.rating ? ` <span class="rt">★ ${esc(r.rating)}</span>` : ''}<small>${esc(r.addr || '')}</small></div><button class="radd${r.done ? ' done' : ''}" data-ri="${i}" ${r.done ? 'disabled' : ''}>${r.done ? esc(r.done) : '추가'}</button></div>`).join('');
  };
  const find = async () => {
    const q = $m('#adq').value.trim(); if(!q) return;
    const my = ++gen; drawRes('찾는 중…');
    try{
      const near = nearDay();
      if(/^https?:\/\//i.test(q)){
        const r = await resolveItem({kind:'url', url:q, hint:'', addr:''}, near);
        if(my !== gen) return;
        if(r && r.list){ drawRes(`구글 지도 목록 링크예요 · 아래 ‘여러 곳 한꺼번에 적기’에 넣으면 목록 전체를 가져와요`); return; }
        results = r && Number.isFinite(+r.lat) ? [r] : [];
      }else results = (await searchPlaces(q, near)).slice(0, 8);
      if(my !== gen) return;
      if(!results.length) return drawRes(`찾지 못했어요 · 다른 표기(현지어·영어)로 찾거나 구글 지도에서 ‘공유’로 복사한 링크를 넣어 보세요`);
      drawRes();
    }catch(e){ if(my === gen) drawRes('검색 실패: ' + esc(e.message)); }
  };
  $m('#adFind').onclick = find;
  $m('#adq').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); find(); } });
  $m('#adRes').addEventListener('click', e => {
    const b = e.target.closest('[data-ri]'); if(!b) return;
    const r = results[+b.dataset.ri], t = trip(); if(!r || !t) return;
    const ex = placesArr(t).find(p => samePlace(p, r)), ed = ex ? effDay(t, ex) : null;
    if(ex && ed === d && !confirm(`‘${ex.name}’은(는) 이미 ${d}일차에 있어요. 한 번 더 넣을까요?`)) return;
    const copy = ex && ed !== 0;   // 다른 날(또는 같은 날)에 있던 곳은 하나 더 만들고, 보관함에 있던 곳은 옮김
    const src = copy ? {name:ex.name, addr:ex.addr, lat:ex.lat, lng:ex.lng, cat:ex.cat, stay:ex.stay, hours:ex.hours, hoursText:ex.hoursText, rating:ex.rating, reviews:ex.reviews, gmaps:ex.gmaps, gid:ex.gid} : r;
    commit(opsFor([ex && !copy ? {p:ex, isNew:false} : {p:src, isNew:true}]));
    r.done = copy && ed !== d ? `넣었어요 · ${ed}일차에도 있음` : '넣었어요'; drawRes(); drawPool();
    toast(`‘${ex ? ex.name : r.name}’ → ${d}일차` + (copy && ed !== d ? ` (${ed}일차에도 있어요)` : ''));
  });
  $m('#adPool').addEventListener('change', e => {
    const c = e.target.closest('[data-pk]'); if(!c) return;
    if(c.checked) picked.add(c.dataset.pk); else picked.delete(c.dataset.pk);
    const b = $m('#adAdd'); b.hidden = !picked.size; b.textContent = `${picked.size}곳 넣기`;
  });
  $m('#adAdd').onclick = () => {
    const t = trip(); if(!t) return;
    const ps = [...picked].map(id => t.places[id]).filter(p => p && effDay(t, p) === 0);
    if(!ps.length) return;
    // 이 날 동선에서 가까운 곳부터 자리 찾기
    const gap = gapFn(t);
    commit(opsFor(ps.sort((a, b) => gap(a) - gap(b)).map(p => ({p, isNew:false}))));
    toast(`${ps.length}곳을 ${d}일차에 넣었어요`);
    gen++; closeModal();
  };
  $m('#adBulk').onclick = () => { gen++; closeModal(); bulkModal(d); };
  $m('#adClose').onclick = () => { gen++; closeModal(); };
  drawPool();
  $m('#adq').focus();
}

/* 파일로 열었을 때 → 인터넷 주소로 옮기기 */
async function migrateToSite(btn){
  if(btn){ btn.disabled = true; btn.textContent = '옮기는 중…'; }
  const ids = [], mes = [];
  try{
    for(const tid of S.order){
      if(!S.trips[tid]) continue;
      if(!isShared(tid)) await Sync.create(tid);
      ids.push(tid); mes.push(S.me[tid] || '');
    }
    for(const tid of ids) if(!(await Sync.flushAll(tid))) throw new Error('아직 서버에 저장 안 된 변경이 있어요. 인터넷 연결을 확인해 주세요');
    location.href = CONFIG.SITE + '#import=' + ids.join(',') + '&me=' + mes.join(',');
  }catch(e){
    toast('옮기기 실패: ' + e.message + ' · 이 컴퓨터 저장본으로 열어요', 5000);
    if(btn){ btn.disabled = false; btn.textContent = '옮기고 열기'; }
    else bootLocal();
  }
}

/* 모바일: 지도·일정 나누는 손잡이(끌기·누르기). 크기는 이 기기에만 기억 */
function initSplit(){
  const h = $('#split'), app = $('#app'), KEY = 'travelPlanner.mapH', SIZES = [0.22, 0.42, 0.68];
  let r = 0.42, idle = 0, drag = null;
  try{ const v = +localStorage.getItem(KEY); if(v >= 0.12 && v <= 0.88) r = v; }catch(e){}
  // 지도는 위쪽에 붙여 둔 채(옮기지 않음) 크기만 바꿈. 끄는 동안에는 다시 그리지 않아 동선이 흔들리지 않고,
  // 손가락을 멈추거나 놓으면 한 번만 새 영역을 채운다
  const fill = () => { clearTimeout(idle); map.invalidateSize({pan:false, debounceMoveend:true}); };
  const apply = (v, save) => {
    r = Math.min(0.85, Math.max(0.12, v));
    app.style.setProperty('--mapH', (r*100).toFixed(1) + '%');
    if(save){ try{ localStorage.setItem(KEY, String(r)); }catch(e){} }
  };
  apply(r, false); requestAnimationFrame(fill);
  h.addEventListener('pointerdown', e => {
    if(!e.isPrimary || e.button !== 0 || drag) return;   // 두 번째 손가락·오른쪽 클릭은 무시
    drag = {y:e.clientY, r, moved:false, id:e.pointerId}; h.setPointerCapture(e.pointerId); h.classList.add('on'); e.preventDefault();
  });
  h.addEventListener('pointermove', e => {
    if(!drag || e.pointerId !== drag.id) return;
    const dy = e.clientY - drag.y; if(Math.abs(dy) > 4) drag.moved = true;
    if(!drag.moved) return;
    apply(drag.r + dy / (app.clientHeight || 1), false);
    clearTimeout(idle); idle = setTimeout(fill, 220);   // 잠깐 멈추면 채우기
  });
  const end = e => {
    if(!drag || (e && e.pointerId !== drag.id)) return;
    h.classList.remove('on');
    if(!drag.moved){ const i = SIZES.findIndex(v => v > r + 0.02); apply(SIZES[i < 0 ? 0 : i], true); }   // 누르면 작게 → 보통 → 크게
    else apply(r, true);
    drag = null; requestAnimationFrame(fill);
  };
  h.addEventListener('pointerup', end);
  h.addEventListener('pointercancel', e => { if(!drag || e.pointerId !== drag.id) return; h.classList.remove('on'); if(drag.moved) apply(r, true); drag = null; requestAnimationFrame(fill); });   // 취소는 '누르기'가 아님
  for(const ev of ['touchstart', 'touchmove']) h.addEventListener(ev, e => { if(e.cancelable) e.preventDefault(); }, {passive:false});
  h.addEventListener('keydown', e => {
    if(e.key === 'ArrowUp'){ e.preventDefault(); apply(r - 0.05, true); fill(); }
    else if(e.key === 'ArrowDown'){ e.preventDefault(); apply(r + 0.05, true); fill(); }
  });
}

let toastTimer;
function toast(msg, ms = 2800){ const el = $('#toast'); el.textContent = msg; el.classList.remove('act'); el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), ms); }
function toastUndo(msg, undo, ms = 6000){   // '되돌리기' 버튼이 달린 알림
  const el = $('#toast'); el.textContent = msg;
  const b = document.createElement('button'); b.textContent = '되돌리기';
  b.onclick = () => { clearTimeout(toastTimer); el.classList.remove('on', 'act'); undo(); };
  el.appendChild(b); el.classList.add('on', 'act');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on', 'act'), ms);
}

let tourRun = null;
function tourEl(sel){
  const el = sel && document.querySelector(sel); if(!el || el.closest('[hidden]')) return null;
  const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0 ? el : null;
}
function runTour(steps, onDone){
  steps = steps.filter(st => !st.sel || tourEl(st.sel));
  if(!steps.length){ if(onDone) onDone('done'); return; }
  if(tempMarker){ tempMarker.remove(); tempMarker = null; }
  map.closePopup();
  tourRun = {steps, i:0, onDone};
  $('#tour').classList.add('on'); drawTour();
  $('#tour .tour-card [data-t="next"]')?.focus();
}
function drawTour(){
  if(!tourRun) return;
  const {steps, i} = tourRun, st = steps[i], el = st.sel ? tourEl(st.sel) : null;
  const hole = $('#tour .tour-hole'), card = $('#tour .tour-card');
  card.innerHTML = `${st.icon ? `<div class="ic">${TOUR_ICON[st.icon]}</div>` : ''}<h4>${st.title}</h4><p>${st.text}</p>
    <div class="tf"><div class="dots">${steps.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
    ${i > 0 ? '<button data-t="prev">이전</button>' : '<button data-t="skip">건너뛰기</button>'}
    <button class="primary" data-t="next">${i === steps.length-1 ? (tourRun.lastLabel || '시작하기') : '다음'}</button></div>`;
  const vw = innerWidth, vh = innerHeight, pad = 6, cw = card.offsetWidth, ch = card.offsetHeight;
  const dim = $('#tour .tour-dim path');
  if(!el){
    dim.setAttribute('d', `M0 0H${vw}V${vh}H0Z`);
    Object.assign(hole.style, {left:vw/2 + 'px', top:vh/2 + 'px', width:'0px', height:'0px'});
    Object.assign(card.style, {left:Math.max(16, (vw - cw)/2) + 'px', top:Math.max(16, (vh - ch)/2) + 'px'});
    return;
  }
  const r = el.getBoundingClientRect();
  const x = Math.max(4, r.left - pad), y = Math.max(4, r.top - pad), w = Math.min(vw - x - 4, r.width + pad*2), h = Math.min(vh - y - 4, r.height + pad*2);
  Object.assign(hole.style, {left:x + 'px', top:y + 'px', width:w + 'px', height:h + 'px'});
  const rr = 10;   // 강조할 곳만 뚫린 어두운 막(둥근 모서리)
  dim.setAttribute('d', `M0 0H${vw}V${vh}H0Z M${x+rr} ${y}H${x+w-rr}Q${x+w} ${y} ${x+w} ${y+rr}V${y+h-rr}Q${x+w} ${y+h} ${x+w-rr} ${y+h}H${x+rr}Q${x} ${y+h} ${x} ${y+h-rr}V${y+rr}Q${x} ${y} ${x+rr} ${y}Z`);
  let cx = Math.min(Math.max(16, x + w/2 - cw/2), vw - cw - 16), cy;
  if(h > vh*0.35 && w > vw*0.35) cy = Math.max(16, y + h - ch - 24);            // 지도처럼 큰 곳은 그 안 아래쪽에
  else if(y + h + 12 + ch < vh - 8) cy = y + h + 12;                               // 아래
  else if(y - 12 - ch > 8) cy = y - 12 - ch;                                        // 위
  else { cy = Math.min(vh - ch - 16, Math.max(16, y + h/2 - ch/2)); cx = (x + w + 12 + cw < vw) ? x + w + 12 : Math.max(16, x - 12 - cw); }
  Object.assign(card.style, {left:cx + 'px', top:cy + 'px'});
}
function endTour(reason){
  const r = tourRun; tourRun = null; $('#tour').classList.remove('on');
  if(r && r.onDone) r.onDone(reason);
}
$('#tour').addEventListener('click', e => {
  const b = e.target.closest('[data-t]'); if(!b || !tourRun) return;
  const a = b.dataset.t;
  if(a === 'next'){ if(tourRun.i < tourRun.steps.length-1){ tourRun.i++; drawTour(); } else endTour('done'); }
  else if(a === 'prev'){ tourRun.i = Math.max(0, tourRun.i - 1); drawTour(); }
  else if(a === 'skip') endTour('skip');
});
document.addEventListener('keydown', e => {
  if(!tourRun) return;
  if(e.key === 'Escape'){ e.preventDefault(); endTour('skip'); }
  else if(e.key === 'ArrowRight'){ $('#tour [data-t="next"]')?.click(); }
  else if(e.key === 'ArrowLeft'){ $('#tour [data-t="prev"]')?.click(); }
});
window.addEventListener('resize', () => { if(tourRun) drawTour(); });
// 처음 온 사람: 소개 3장 → 첫 여행 만들기 → (만든 뒤) 화면 둘러보기. 링크로 들어온 친구: 이름 고른 뒤 '초대받은 여행' 안내부터
function maybeTour(){
  if(tourRun || (S.tour && S.tour.done)) return;
  if($('#modal').classList.contains('on')) return;
  const t = trip(); if(!t) return;
  if(isShared() && (!S.sync[S.cur]?.rev || !S.me[S.cur] || !t.members[S.me[S.cur]])) return;   // 공유 여행은 내용을 받고 이름을 고른 뒤에
  const steps = [];
  if(!(S.tour && S.tour.intro)) steps.push(...TOUR_INTRO);
  if(isShared() && view.joined === S.cur) steps.push(TOUR_JOIN);
  steps.push(...TOUR_UI);
  runTour(steps, () => { S.tour = {intro:true, done:true}; save(); });
}
function introThenNewTrip(){
  if(S.tour && (S.tour.intro || S.tour.done)){ newTripModal(); return; }
  runTour(TOUR_INTRO.concat([{icon:'pin', title:'첫 여행을 만들어 볼까요?', text:'목적지를 고르면 바로 시작돼요. 여행을 만들면 화면 쓰는 법을 이어서 짧게 보여 드릴게요.'}]), reason => {
    S.tour = {intro:true, done:reason === 'skip'}; save(); newTripModal();
  });
}
$('#btnHelp').onclick = () => {
  closeModal();
  if(!trip()){ runTour(TOUR_INTRO, () => newTripModal()); return; }
  runTour(TOUR_INTRO.concat(TOUR_UI), () => { S.tour = {intro:true, done:true}; save(); });
};

/* 새 버전 알림: 열어 둔 창이 예전 버전이면 새로고침을 권함 */

  try{
    const html = await (await fetch(location.pathname, {cache:'no-store'})).text();
    const m = html.match(/BUILD: '(\d{8,})'/);
    if(m && m[1] !== CONFIG.BUILD) $('#upd').hidden = false;
  }catch(e){}
}
$('#updGo').onclick = () => location.reload();
setInterval(checkUpdate, 5*60000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkUpdate(); });

/* ================= 시작 ================= */
function syncHash(){
  const tid = S.cur, want = tid && isShared(tid) ? '#t=' + tid : '';
  if(location.hash !== want && !(want === '' && location.hash === '')){ try{ history.replaceState(null, '', location.pathname + location.search + want); }catch(e){} }
}
function addJoin(tid){
  dropped.delete(tid);
  if(!S.trips[tid]) S.trips[tid] = newDoc({name:'불러오는 중…'});
  if(!S.sync[tid]) S.sync[tid] = {rev:0, q:[]};
  if(!S.order.includes(tid)) S.order.push(tid);
}
function handleHash(){
  const h = new URLSearchParams(location.hash.slice(1));
  const impAll = (h.get('import') || '').split(','), mes = (h.get('me') || '').split(',');
  let first = null;
  impAll.forEach((tid, i) => { if(!validId(tid)) return; addJoin(tid); if(mes[i] && !S.me[tid]) S.me[tid] = mes[i]; if(!first) first = tid; });
  if(first) S.cur = first;
  const tj = h.get('t'); if(validId(tj)){ if(!S.trips[tj]) view.joined = tj; addJoin(tj); S.cur = tj; }   // 링크로 처음 들어온 여행
  save(); syncHash();
}
async function openShared(tid){
  Sync.watch(tid);
  try{
    const ok = await Sync.load(tid);
    if(ok === false){
      toast('링크의 여행을 찾을 수 없어요');
      if(S.sync[tid] && !S.sync[tid].rev){
        dropped.add(tid); Sync.unwatch(tid); delete S.trips[tid]; delete S.sync[tid]; S.order = S.order.filter(x => x !== tid); save();
        if(S.cur === tid) switchTrip(S.order[0] || null); else { syncHash(); renderAll(); }
        if(!trip()) newTripModal();
      }
      return;
    }
  }catch(e){ toast('서버에 연결하지 못했어요. 이 기기에 저장된 내용으로 보여줘요'); if(S.cur === tid) Sync.setStatus('off'); }
  if(S.cur === tid){ renderAll(); fitView(); ensureMe(tid); }
}
function boot(){
  Sync.init();
  // 바탕화면 아이콘(파일)로 열었을 때: 인터넷에 연결돼 있으면 인터넷 주소로 넘어가기.
  // 이 컴퓨터에만 있던 여행은 먼저 올리고(공유 링크 방식, 링크를 아는 사람만 볼 수 있음) 함께 넘긴다.
  if(location.protocol === 'file:' && Sync.sb && CONFIG.SITE && navigator.onLine !== false){
    const ids = S.order.filter(id => S.trips[id]);
    if(!ids.length){ location.replace(CONFIG.SITE); return; }
    try{ renderAll(); }catch(e){}
    toast('인터넷 주소로 옮기는 중…', 20000);
    migrateToSite(null).catch(() => {});
    return;
  }
  bootLocal();
}
let booted = false;
function bootLocal(){
  if(booted) return; booted = true;
  handleHash();
  if(S.cur && !S.trips[S.cur]) S.cur = S.order[0] || null;
  try{ renderAll(); fitView(); }catch(e){ console.error(e); }   // 화면 그리기가 실패해도 동기화·새로 받기는 계속
  if(S.cur && isShared(S.cur)) openShared(S.cur);
  else if(!trip()) introThenNewTrip();
  setTimeout(maybeTour, 900);
  for(const tid of S.order) if(tid !== S.cur && S.sync[tid] && !S.sync[tid].rev) Sync.load(tid).catch(() => {});   // 옮겨 온 다른 여행들 이름 받아 오기
  window.addEventListener('storage', e => { if(e.key === LS_KEY && e.newValue && mergeDisk(e.newValue)) renderHeader(); });
  setInterval(() => Sync.poll(), 20000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) Sync.poll(); });
  window.addEventListener('online', () => { if(S.cur && isShared(S.cur)) Sync.flush(S.cur); });
  window.addEventListener('hashchange', () => { const h = new URLSearchParams(location.hash.slice(1)).get('t'); if(validId(h) && h !== S.cur){ addJoin(h); save(); switchTrip(h); } });
  window.addEventListener('resize', () => map.invalidateSize());
  initSplit();
}
boot();
</script>
